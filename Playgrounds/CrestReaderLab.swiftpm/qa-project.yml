name: CrestReaderLabQA
options:
  bundleIdPrefix: com.davidpovarsky
  createIntermediateGroups: true
targets:
  CrestReaderLabQA:
    type: application
    platform: iOS
    deploymentTarget: "26.0"
    sources:
      - path: Sources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.davidpovarsky.crestreaderlab.qa
        PRODUCT_NAME: CrestReaderLabQA
        SWIFT_VERSION: "5.9"
        TARGETED_DEVICE_FAMILY: "2"
        CODE_SIGNING_ALLOWED: "NO"
        GENERATE_INFOPLIST_FILE: "YES"
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: "YES"
        INFOPLIST_KEY_UILaunchScreen_Generation: "YES"
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPad: "UIInterfaceOrientationPortrait UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight"
