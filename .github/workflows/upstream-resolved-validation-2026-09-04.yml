name: Upstream resolved full validation 2026-09-04

on:
  workflow_dispatch:
  push:
    branches:
      - codex/upstream-main-sync-2026-09-04-resolved
    paths:
      - .github/workflows/upstream-resolved-validation-2026-09-04.yml
      - Maktabah.xcodeproj/**
      - Source/**
      - Vendor/**
      - Scripts/**

permissions:
  contents: read

env:
  PROJECT_PATH: Maktabah.xcodeproj
  SCHEME: Maktabah-iOS
  PRODUCT_NAME: Maktabah
  CARGO_TERM_COLOR: always

jobs:
  full-validation:
    runs-on: macos-26
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Confirm merge ancestry
        run: |
          set -euo pipefail
          git merge-base --is-ancestor f239428739996d71a9e9696cb931f8ce35a83161 HEAD
          git merge-base --is-ancestor 06158e767ee765f2451461a34d18feeeccc79fa5 HEAD

      - name: Select Xcode 26
        run: bash Scripts/CI/select-xcode-26.sh

      - uses: dtolnay/rust-toolchain@stable

      - name: Build pinned Otzaria search XCFramework
        run: |
          set -euo pipefail
          bash Scripts/CI/ensure-otzaria-upstream-checkout.sh
          bash Vendor/OtzariaSearchEngine/build_xcframework.sh
          bash Scripts/CI/verify-xcframework.sh Vendor/OtzariaSearchEngine/OtzariaSearchEngine.xcframework otzaria_search_engine.h
          cargo check --locked --features semantic --manifest-path Vendor/OtzariaSearchEngine/ios_bridge/Cargo.toml
          bash Scripts/CI/ensure-otzaria-upstream-checkout.sh --verify-only

      - name: Build Zayit search XCFramework
        run: |
          set -euo pipefail
          bash Vendor/ZayitSearchPort/Scripts/build-ios-xcframework.sh
          bash Scripts/CI/verify-xcframework.sh Vendor/ZayitSearchPort/build/MaktabahZayitSearch.xcframework maktabah_zayit_search.h

      - name: Verify Xcode integration
        run: |
          set -euo pipefail
          python3 Scripts/CI/verify-otzaria-xcode-project.py
          xcodebuild -list -project "$PROJECT_PATH"

      - name: Resolve Swift packages
        run: |
          set -euo pipefail
          rm -rf build/SourcePackages
          xcodebuild -resolvePackageDependencies \
            -project "$PROJECT_PATH" \
            -scheme "$SCHEME" \
            -clonedSourcePackagesDirPath build/SourcePackages

      - name: Build iOS Simulator
        run: |
          set -o pipefail
          mkdir -p build/logs
          rm -rf build/DerivedData
          JOBS="$(sysctl -n hw.ncpu)"
          [ "$JOBS" -le 8 ] || JOBS=8
          xcodebuild build \
            -project "$PROJECT_PATH" \
            -scheme "$SCHEME" \
            -configuration Debug \
            -sdk iphonesimulator \
            -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath build/DerivedData \
            -clonedSourcePackagesDirPath build/SourcePackages \
            -disableAutomaticPackageResolution \
            -parallelizeTargets -jobs "$JOBS" -showBuildTimingSummary \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" \
            2>&1 | tee build/logs/build-simulator.log
          APP="build/DerivedData/Build/Products/Debug-iphonesimulator/${PRODUCT_NAME}.app"
          test -d "$APP"
          test -f "$APP/dictionary.json"
          test -f "$APP/Acronyms.json"

      - name: Native Otzaria bootstrap smoke test
        run: |
          set -euo pipefail
          APP="build/DerivedData/Build/Products/Debug-iphonesimulator/${PRODUCT_NAME}.app"
          bash Scripts/run-otzaria-native-bootstrap-acceptance.sh "$APP" --dictionary-only

      - name: Build unsigned iOS device app
        run: |
          set -o pipefail
          rm -rf build/DerivedData-iphoneos
          JOBS="$(sysctl -n hw.ncpu)"
          [ "$JOBS" -le 8 ] || JOBS=8
          xcodebuild build \
            -project "$PROJECT_PATH" \
            -scheme "$SCHEME" \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build/DerivedData-iphoneos \
            -clonedSourcePackagesDirPath build/SourcePackages \
            -disableAutomaticPackageResolution \
            -parallelizeTargets -jobs "$JOBS" -showBuildTimingSummary \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" \
            2>&1 | tee build/logs/build-device.log
          APP="build/DerivedData-iphoneos/Build/Products/Release-iphoneos/${PRODUCT_NAME}.app"
          test -d "$APP"
          if find "$APP" -type f \( -name 'seforim.db' -o -name 'lexical.db' \) -print -quit | grep -q .; then
            echo "Runtime Otzaria databases must not be embedded in the app bundle" >&2
            exit 1
          fi
          if find "$APP" -type d -name 'zayit-search-index' -print -quit | grep -q .; then
            echo "Runtime Zayit search index must not be embedded in the app bundle" >&2
            exit 1
          fi

      - name: Build macOS Direct
        run: |
          set -o pipefail
          rm -rf build/DerivedData-macos
          xcodebuild build \
            -project "$PROJECT_PATH" \
            -scheme Maktabah-Direct \
            -configuration Debug \
            -destination 'generic/platform=macOS' \
            -derivedDataPath build/DerivedData-macos \
            -clonedSourcePackagesDirPath build/SourcePackages \
            -disableAutomaticPackageResolution \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" \
            2>&1 | tee build/logs/build-macos.log

      - name: Final structural invariants
        run: |
          set -euo pipefail
          test -z "$(git diff --name-only --diff-filter=U)"
          ! git grep -n '^<<<<<<<\|^=======$\|^>>>>>>>' -- ':!merge-diagnostics/**'
          grep -q 'OtzariaLibraryDataAdapter.performSearchIfEnabled' 'Source/Managers/Database/LibraryDataManager.swift'
          grep -q 'OtzariaNavigationAdapter.openBookIfEnabled' 'Source/iOS/Managers/iOSNavigationManager.swift'
          grep -q 'UnifiedSearchWorkspaceView' 'Source/iOS/Views/iPadLayout.swift'
          grep -q 'workersLock' 'Source/Managers/Engine/SearchEngine.swift'
          grep -q 'heRef' 'Source/Models/DataModel.swift'
          grep -q '"he"' Source/Localizable.xcstrings

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: upstream-resolved-validation-logs
          path: build/logs
          compression-level: 0
          if-no-files-found: warn
