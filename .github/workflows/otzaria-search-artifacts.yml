name: Build Otzaria Search Artifacts

on:
  workflow_call:
    inputs:
      publish_release:
        description: Publish verified package as a dedicated public data release
        required: true
        type: boolean
      existing_release_tag:
        description: Verify an existing artifact release without rebuilding the corpus
        required: false
        type: string
        default: ""
      repair_manifest_layout:
        description: Republish an existing package with corrected extracted-file metadata
        required: false
        type: boolean
        default: false
  workflow_dispatch:
    inputs:
      publish_release:
        description: Publish verified package as a dedicated public data release
        required: true
        type: boolean
        default: false
      source_release_tag:
        description: Target Otzaria/SeforimLibrary release tag (e.g. v36-20261101064231, or latest)
        required: false
        type: string
        default: "v36-20261101064231"
      existing_release_tag:
        description: Verify an existing artifact release without rebuilding the corpus
        required: false
        type: string
        default: ""
      repair_manifest_layout:
        description: Republish an existing package with corrected extracted-file metadata
        required: false
        type: boolean
        default: false

permissions:
  actions: read
  contents: write

concurrency:
  group: otzaria-search-artifact-${{ github.ref }}
  cancel-in-progress: false

jobs:
  lexical-artifact:
    runs-on: macos-26
    timeout-minutes: 720
    steps:
      - name: Live Activity · refresh
        uses: davidpovarsky/github-automation/live-refresh@main
        continue-on-error: true
        with:
          event: refresh
          device_id: ${{ secrets.NOTIFY_DEVICE_ID }}
          token: ${{ secrets.NOTIFY_DEVICE_TOKEN }}
          github_token: ${{ github.token }}
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 1
      - name: Live Activity · refresh
        uses: davidpovarsky/github-automation/live-refresh@main
        continue-on-error: true
        with:
          event: refresh
          device_id: ${{ secrets.NOTIFY_DEVICE_ID }}
          token: ${{ secrets.NOTIFY_DEVICE_TOKEN }}
          github_token: ${{ github.token }}
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87
        with:
          toolchain: 1.98.1
      - name: Live Activity · refresh
        uses: davidpovarsky/github-automation/live-refresh@main
        continue-on-error: true
        with:
          event: refresh
          device_id: ${{ secrets.NOTIFY_DEVICE_ID }}
          token: ${{ secrets.NOTIFY_DEVICE_TOKEN }}
          github_token: ${{ github.token }}
      - name: Select Xcode 26 and verify committed identity
        id: xcode
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          bash Scripts/CI/select-xcode-26.sh
          echo "id=$(xcodebuild -version | shasum -a 256 | cut -d' ' -f1)" >> "$GITHUB_OUTPUT"
          python3 Vendor/OtzariaSearchEngine/Scripts/sync-otzaria-search-upstream.py --check --skip-validation
          df -h "$RUNNER_TEMP" "$GITHUB_WORKSPACE"
          AVAILABLE_KIB="$(df -Pk "$RUNNER_TEMP" | awk 'NR==2 {print $4}')"
          test "$AVAILABLE_KIB" -ge $((35 * 1024 * 1024))
      - name: Live Activity · refresh
        uses: davidpovarsky/github-automation/live-refresh@main
        continue-on-error: true
        with:
          event: refresh
          device_id: ${{ secrets.NOTIFY_DEVICE_ID }}
          token: ${{ secrets.NOTIFY_DEVICE_TOKEN }}
          github_token: ${{ github.token }}
      - name: Cache build dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            ~/Library/Caches/org.swift.swiftpm
            ~/Library/org.swift.swiftpm
            build/SourcePackages
          key: ${{ runner.os }}-${{ runner.arch }}-otzaria-search-artifact-v1-${{ hashFiles('Vendor/OtzariaSearchEngine/ios_bridge/Cargo.lock', 'Vendor/ZayitSearchPort/Rust/Cargo.lock', 'Maktabah.xcodeproj/project.xcworkspace/xcshareddata/swiftpm/Package.resolved') }}
      - name: Live Activity · refresh
        uses: davidpovarsky/github-automation/live-refresh@main
        continue-on-error: true
        with:
          event: refresh
          device_id: ${{ secrets.NOTIFY_DEVICE_ID }}
          token: ${{ secrets.NOTIFY_DEVICE_TOKEN }}
          github_token: ${{ github.token }}
      - name: Set up Node for the real embedded runtime
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Set up CocoaPods for the real embedded runtime
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.3'
          bundler-cache: true
      - name: Prepare the shipping embedded runtime and resources
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash Scripts/CI/prepare-embedded-artifact-app.sh

      - name: Identify exact Rust toolchain
        id: rustc
        run: echo "id=$(rustc -Vv | shasum -a 256 | cut -d' ' -f1)" >> "$GITHUB_OUTPUT"
      - name: Cache matching Otzaria framework
        id: otzaria-cache
        uses: actions/cache/restore@v4
        with:
          path: |
            Vendor/OtzariaSearchEngine/OtzariaSearchEngine.xcframework
            Vendor/OtzariaSearchEngine/ios_bridge/target
          key: ${{ runner.os }}-${{ runner.arch }}-xcode-${{ steps.xcode.outputs.id }}-otzaria-framework-v3-${{ steps.rustc.outputs.id }}-${{ hashFiles('Vendor/OtzariaSearchEngine/Upstream/**', 'Vendor/OtzariaSearchEngine/Resources/**', 'Vendor/OtzariaSearchEngine/build_xcframework.sh', 'Vendor/OtzariaSearchEngine/ios_bridge/Cargo.toml', 'Vendor/OtzariaSearchEngine/ios_bridge/Cargo.lock', 'Vendor/OtzariaSearchEngine/ios_bridge/build.rs', 'Vendor/OtzariaSearchEngine/ios_bridge/src/**', 'Vendor/OtzariaSearchEngine/include/**', 'Vendor/OtzariaSearchEngine/module.modulemap') }}
      - name: Build exact Otzaria framework when uncached
        if: steps.otzaria-cache.outputs.cache-hit != 'true'
        run: bash Vendor/OtzariaSearchEngine/build_xcframework.sh
      - name: Verify exact Otzaria framework
        run: bash Scripts/CI/verify-xcframework.sh Vendor/OtzariaSearchEngine/OtzariaSearchEngine.xcframework otzaria_search_engine.h
      - name: Preserve verified Otzaria framework before app acceptance
        if: steps.otzaria-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: |
            Vendor/OtzariaSearchEngine/OtzariaSearchEngine.xcframework
            Vendor/OtzariaSearchEngine/ios_bridge/target
          key: ${{ steps.otzaria-cache.outputs.cache-primary-key }}
      - name: Cache matching Zayit framework
        id: zayit-cache
        uses: actions/cache/restore@v4
        with:
          path: |
            Vendor/ZayitSearchPort/build/MaktabahZayitSearch.xcframework
            Vendor/ZayitSearchPort/Rust/target
          key: ${{ runner.os }}-${{ runner.arch }}-xcode-${{ steps.xcode.outputs.id }}-zayit-framework-v3-${{ steps.rustc.outputs.id }}-${{ hashFiles('Vendor/ZayitSearchPort/Rust/Cargo.toml', 'Vendor/ZayitSearchPort/Rust/Cargo.lock', 'Vendor/ZayitSearchPort/Rust/src/**', 'Vendor/ZayitSearchPort/Rust/include/**', 'Vendor/ZayitSearchPort/Scripts/build-ios-xcframework.sh') }}
      - name: Build exact Zayit framework when uncached
        if: steps.zayit-cache.outputs.cache-hit != 'true'
        run: bash Vendor/ZayitSearchPort/Scripts/build-ios-xcframework.sh
      - name: Verify exact Zayit framework
        run: bash Scripts/CI/verify-xcframework.sh Vendor/ZayitSearchPort/build/MaktabahZayitSearch.xcframework maktabah_zayit_search.h
      - name: Preserve verified Zayit framework before app acceptance
        if: steps.zayit-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: |
            Vendor/ZayitSearchPort/build/MaktabahZayitSearch.xcframework
            Vendor/ZayitSearchPort/Rust/target
          key: ${{ steps.zayit-cache.outputs.cache-primary-key }}
      - name: Build simulator app
        run: |
          bash Scripts/CI/resolve-swift-packages.sh -workspace Maktabah.xcworkspace -scheme Maktabah-iOS -clonedSourcePackagesDirPath build/SourcePackages
          xcodebuild build \
            -workspace Maktabah.xcworkspace \
            -scheme Maktabah-iOS \
            -configuration Debug \
            -sdk iphonesimulator \
            -destination "generic/platform=iOS Simulator" \
            -derivedDataPath build/OtzariaArtifactBuild \
            -clonedSourcePackagesDirPath build/SourcePackages \
            -disableAutomaticPackageResolution \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY=
      - name: Live Activity · refresh
        if: ${{ inputs.existing_release_tag != '' }}
        uses: davidpovarsky/github-automation/live-refresh@main
        continue-on-error: true
        with:
          event: refresh
          device_id: ${{ secrets.NOTIFY_DEVICE_ID }}
          token: ${{ secrets.NOTIFY_DEVICE_TOKEN }}
          github_token: ${{ github.token }}
      - name: Restore existing published package
        if: ${{ inputs.existing_release_tag != '' }}
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.existing_release_tag }}
        run: |
          mkdir -p build/otzaria-artifact build/logs
          gh release download "$RELEASE_TAG" \
            --pattern 'otzaria-lexical-*.zst' \
            --pattern 'otzaria-search-manifest.json' \
            --pattern 'otzaria-search-build-metrics.json' \
            --dir build/otzaria-artifact
          python3 - <<'PY'
          import hashlib, json, pathlib
          root = pathlib.Path("build/otzaria-artifact")
          manifest = json.loads((root / "otzaria-search-manifest.json").read_text())
          for part in manifest["lexicalArtifact"]["parts"]:
              path = root / part["assetName"]
              assert path.stat().st_size == part["packagedBytes"], path
              assert hashlib.sha256(path.read_bytes()).hexdigest() == part["sha256"], path
          PY
          printf '%s\n' "$RELEASE_TAG" > build/logs/otzaria-search-release-tag.txt
      - name: Live Activity · refresh
        if: ${{ inputs.existing_release_tag != '' && inputs.repair_manifest_layout }}
        uses: davidpovarsky/github-automation/live-refresh@main
        continue-on-error: true
        with:
          event: refresh
          device_id: ${{ secrets.NOTIFY_DEVICE_ID }}
          token: ${{ secrets.NOTIFY_DEVICE_TOKEN }}
          github_token: ${{ github.token }}
      - name: Repair extracted-file metadata while reusing package bytes
        if: ${{ inputs.existing_release_tag != '' && inputs.repair_manifest_layout }}
        run: |
          python3 Scripts/repair-otzaria-search-artifact-manifest.py \
            --manifest build/otzaria-artifact/otzaria-search-manifest.json \
            --metrics build/otzaria-artifact/otzaria-search-build-metrics.json
      - name: Live Activity · refresh
        uses: davidpovarsky/github-automation/live-refresh@main
        continue-on-error: true
        with:
          event: refresh
          device_id: ${{ secrets.NOTIFY_DEVICE_ID }}
          token: ${{ secrets.NOTIFY_DEVICE_TOKEN }}
          github_token: ${{ github.token }}
      - name: Resolve and download official corpus/resources
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p build/otzaria-artifact build/logs
          brew list zstd >/dev/null 2>&1 || brew install zstd
          if [ -n "${{ inputs.existing_release_tag }}" ]; then
            SOURCE_TAG="$(python3 -c 'import json; print(json.load(open("build/otzaria-artifact/otzaria-search-manifest.json"))["sourceDatabase"]["releaseTag"])')"
            gh api "repos/Otzaria/SeforimLibrary/releases/tags/$SOURCE_TAG" > build/logs/source-release.json
          elif [ -n "${{ inputs.source_release_tag }}" ] && [ "${{ inputs.source_release_tag }}" != "latest" ]; then
            gh api "repos/Otzaria/SeforimLibrary/releases/tags/${{ inputs.source_release_tag }}" > build/logs/source-release.json
          else
            gh api repos/Otzaria/SeforimLibrary/releases/latest > build/logs/source-release.json
          fi
          gh api repos/Otzaria/SeforimMagicIndexer/releases/latest > build/logs/magic-release.json
          python3 Scripts/resolve-official-library-asset.py --release-json build/logs/source-release.json --format shell > build/logs/source-asset.env
          source build/logs/source-asset.env
          echo "ASSET_NAME=$ASSET_NAME" >> "$GITHUB_ENV"
          curl --fail --location --retry 5 --continue-at - --output "$RUNNER_TEMP/$ASSET_NAME" "$ASSET_BROWSER_DOWNLOAD_URL"
          if [ -n "$ASSET_COMPRESSED_SHA256" ]; then
            test "$(shasum -a 256 "$RUNNER_TEMP/$ASSET_NAME" | cut -d' ' -f1)" = "$ASSET_COMPRESSED_SHA256"
          fi
          zstd -d --long=31 --no-progress -f "$RUNNER_TEMP/$ASSET_NAME" -o "$RUNNER_TEMP/seforim.db"
          if [ -n "${{ inputs.existing_release_tag }}" ]; then
            python3 - "$RUNNER_TEMP/seforim.db" <<'PY'
          import hashlib, json, pathlib, sys
          database = pathlib.Path(sys.argv[1])
          source = json.load(open("build/otzaria-artifact/otzaria-search-manifest.json"))["sourceDatabase"]
          assert database.stat().st_size == source["databaseBytes"]
          digest = hashlib.sha256()
          with database.open("rb") as handle:
              while chunk := handle.read(8 * 1024 * 1024):
                  digest.update(chunk)
          assert digest.hexdigest() == source["databaseSHA256"]
          PY
          fi
      - name: Live Activity · refresh
        if: ${{ inputs.existing_release_tag == '' }}
        uses: davidpovarsky/github-automation/live-refresh@main
        continue-on-error: true
        with:
          event: refresh
          device_id: ${{ secrets.NOTIFY_DEVICE_ID }}
          token: ${{ secrets.NOTIFY_DEVICE_TOKEN }}
          github_token: ${{ github.token }}
      - name: Build the full lexical index once and record disk samples
        if: ${{ inputs.existing_release_tag == '' }}
        env:
          OTZARIA_CORPUS_ACCEPTANCE_SKIP_BUILD: "1"
          OTZARIA_CORPUS_ACCEPTANCE_APP_PATH: ${{ github.workspace }}/build/OtzariaArtifactBuild/Build/Products/Debug-iphonesimulator/Maktabah.app
          OTZARIA_CORPUS_ACCEPTANCE_REPORT_COPY: ${{ github.workspace }}/build/logs/otzaria-corpus-acceptance.json
          OTZARIA_CORPUS_ACCEPTANCE_INDEX_PATH_FILE: ${{ github.workspace }}/build/logs/otzaria-index-path.txt
          OTZARIA_CORPUS_ACCEPTANCE_DURATION_FILE: ${{ github.workspace }}/build/logs/otzaria-build-duration.txt
          OTZARIA_CORPUS_ACCEPTANCE_METRICS_SAMPLES: ${{ github.workspace }}/build/logs/otzaria-disk-samples.jsonl
          OTZARIA_CORPUS_ACCEPTANCE_WAIT_ROUNDS: "7200"
        run: bash Scripts/run-otzaria-corpus-acceptance.sh "$RUNNER_TEMP/seforim.db"
      - name: Live Activity · refresh
        if: ${{ inputs.existing_release_tag == '' }}
        uses: davidpovarsky/github-automation/live-refresh@main
        continue-on-error: true
        with:
          event: refresh
          device_id: ${{ secrets.NOTIFY_DEVICE_ID }}
          token: ${{ secrets.NOTIFY_DEVICE_TOKEN }}
          github_token: ${{ github.token }}
      - name: Package deterministic streaming parts and manifest
        if: ${{ inputs.existing_release_tag == '' }}
        run: |
          INDEX="$(cat build/logs/otzaria-index-path.txt)"
          PEAK="$(python3 -c 'import json; print(max((r["databaseBytes"]+r["indexRootBytes"] for r in map(json.loads, open("build/logs/otzaria-disk-samples.jsonl"))), default=0))')"
          test "$PEAK" -gt 0
          DURATION="$(cat build/logs/otzaria-build-duration.txt)"
          find "$INDEX" -name ".managed.json" -delete 2>/dev/null || true
          python3 Scripts/package-otzaria-search-artifact.py \
            --index "$INDEX" \
            --database "$RUNNER_TEMP/seforim.db" \
            --database-asset-name "${ASSET_NAME:?official schema asset is required}" \
            --release-json build/logs/source-release.json \
            --magic-release-json build/logs/magic-release.json \
            --acceptance-json build/logs/otzaria-corpus-acceptance.json \
            --output build/otzaria-artifact \
            --peak-build-bytes "$PEAK" \
            --build-duration-seconds "$DURATION"
          python3 -m json.tool build/otzaria-artifact/otzaria-search-manifest.json >/dev/null
      - name: Live Activity · refresh
        if: ${{ inputs.publish_release && (inputs.existing_release_tag == '' || inputs.repair_manifest_layout) }}
        uses: davidpovarsky/github-automation/live-refresh@main
        continue-on-error: true
        with:
          event: refresh
          device_id: ${{ secrets.NOTIFY_DEVICE_ID }}
          token: ${{ secrets.NOTIFY_DEVICE_TOKEN }}
          github_token: ${{ github.token }}
      - name: Publish durable development-data release
        if: ${{ inputs.publish_release && (inputs.existing_release_tag == '' || inputs.repair_manifest_layout) }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          IDENTITY="$(python3 -c 'import json; print(json.load(open("build/otzaria-artifact/otzaria-search-manifest.json"))["artifactIdentity"])')"
          SOURCE_TAG="$(python3 -c 'import json; print(json.load(open("build/logs/source-release.json"))["tag_name"])')"
          TAG="otzaria-search-data-${SOURCE_TAG}-${IDENTITY:0:12}"
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Verified artifact release $TAG already exists; refusing a duplicate rebuild publication."
          else
            gh release create "$TAG" build/otzaria-artifact/* --target "$GITHUB_SHA" --title "Otzaria search data $SOURCE_TAG" --notes "Prebuilt Otzaria Tantivy search data. Artifact identity: $IDENTITY"
            git fetch origin "refs/tags/$TAG:refs/tags/$TAG"
            test "$(git rev-list -n 1 "$TAG")" = "$GITHUB_SHA"
          fi
          printf '%s\n' "$TAG" > build/logs/otzaria-search-release-tag.txt
      - name: Live Activity · refresh
        uses: davidpovarsky/github-automation/live-refresh@main
        continue-on-error: true
        with:
          event: refresh
          device_id: ${{ secrets.NOTIFY_DEVICE_ID }}
          token: ${{ secrets.NOTIFY_DEVICE_TOKEN }}
          github_token: ${{ github.token }}
      - name: Prove package portability and relaunch without indexing
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          RELEASE_TAG="$(cat build/logs/otzaria-search-release-tag.txt 2>/dev/null || true)"
          RELEASE_BASE_URL=""
          RELEASES_JSON=""
          if [ -n "$RELEASE_TAG" ]; then
            RELEASE_BASE_URL="https://github.com/${{ github.repository }}/releases/download/$RELEASE_TAG"
            RELEASES_JSON="build/logs/otzaria-search-releases.json"
            gh api 'repos/${{ github.repository }}/releases?per_page=30' > "$RELEASES_JSON"
          fi
          bash Scripts/run-otzaria-prebuilt-acceptance.sh \
            build/OtzariaArtifactBuild/Build/Products/Debug-iphonesimulator/Maktabah.app \
            "$RUNNER_TEMP/seforim.db" \
            build/otzaria-artifact/otzaria-search-manifest.json \
            build/otzaria-artifact \
            "$RELEASE_BASE_URL" \
            "$RELEASES_JSON"
      - name: Live Activity · refresh
        if: always()
        uses: davidpovarsky/github-automation/live-refresh@main
        continue-on-error: true
        with:
          event: refresh
          device_id: ${{ secrets.NOTIFY_DEVICE_ID }}
          token: ${{ secrets.NOTIFY_DEVICE_TOKEN }}
          github_token: ${{ github.token }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: otzaria-search-artifact-reports
          path: |
            build/logs
            build/otzaria-artifact/otzaria-search-manifest.json
            build/otzaria-artifact/otzaria-search-build-metrics.json
          compression-level: 0
          if-no-files-found: warn
      - name: Live Activity · refresh
        if: always()
        uses: davidpovarsky/github-automation/live-refresh@main
        continue-on-error: true
        with:
          event: refresh
          device_id: ${{ secrets.NOTIFY_DEVICE_ID }}
          token: ${{ secrets.NOTIFY_DEVICE_TOKEN }}
          github_token: ${{ github.token }}
      - name: Confirm package data was not added to git
        if: always()
        run: |
          # Restore only the two known CocoaPods-generated edits in this disposable checkout.
          # Their exact patch is retained in build/logs/cocoapods-generated.patch.
          git restore --source=HEAD -- Maktabah.xcodeproj/project.pbxproj Source/PrivacyInfo.xcprivacy
          git checkout -- Maktabah.xcodeproj/project.xcworkspace/xcshareddata/swiftpm/Package.resolved 2>/dev/null || true
          git status --short --untracked-files=no
          test -z "$(git status --short --untracked-files=no)"
          test -z "$(git ls-files '*.gguf' '*.db.zst' 'build/otzaria-artifact/*')"
