name: Original annotation disconnect RED and repaired whole-source regression

on:
  push:
    branches:
      - codex/otzaria-annotation-disconnect-apple-v2-reviewed-20261120

permissions:
  actions: read
  contents: read

concurrency:
  group: annotation-disconnect-apple-${{ github.ref }}
  cancel-in-progress: false

jobs:
  original-repository-disconnect:
    if: ${{ github.event_name == 'push' && github.repository == 'davidpovarsky/Maktabah' && github.ref == 'refs/heads/codex/otzaria-annotation-disconnect-apple-v2-reviewed-20261120' }}
    runs-on: xcode-27
    timeout-minutes: 75
    env:
      EXPECTED_CHECKOUT_SHA: ${{ github.sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 3
          submodules: false
          persist-credentials: false
      - name: Bind exact original and candidate source before execution
        id: source
        timeout-minutes: 3
        run: |
          python3 - <<'PYBOOT'
          import hashlib, json, pathlib
          root = pathlib.Path.cwd()
          output = root / 'build/annotation-disconnect-route'
          output.mkdir(parents=True, exist_ok=True)
          expected = {'Scripts/CI/annotation-disconnect-apple.py': '08080460e40b8a6ac3b88a8d76b8a1e23737bab505ea94bc556cac5624c7b4b7', 'Scripts/CI/annotation-disconnect-apple.inputs.json': 'ef2bc57d4c7b8d0cfc65e6dea46647c8e909214bbe609ba6749eeced65ba920d', 'Scripts/CI/test-annotation-disconnect-apple.py': 'e9f8c9da12600d5b39ff683f74dea8fc5f1697ad261eb458a1436ef102a140cd', 'Scripts/CI/select-runtime27-toolchain.py': '92b748b10a32e8d40ff97190bb3b0ba4c199c5e688d8897084406b1bbad43dd8'}
          report = {'status': 'FAILED', 'scope': 'Source bootstrap only; no Swift or Native execution', 'pins': expected}
          try:
              if set(expected) != {'Scripts/CI/annotation-disconnect-apple.py', 'Scripts/CI/annotation-disconnect-apple.inputs.json', 'Scripts/CI/test-annotation-disconnect-apple.py', 'Scripts/CI/select-runtime27-toolchain.py'}:
                  raise ValueError('Final reviewed source bootstrap has not been supplied')
              for relative, digest in expected.items():
                  if hashlib.sha256((root / relative).read_bytes()).hexdigest() != digest:
                      raise ValueError('Reviewed executable CI input differs: ' + relative)
              report['status'] = 'BOOTSTRAP_SOURCE_BOUND'
          except Exception as error:
              report['error'] = repr(error)
              raise
          finally:
              (output / 'bootstrap.json').write_text(json.dumps(report, sort_keys=True, indent=2) + '\n', encoding='utf-8')
          PYBOOT
          python3 Scripts/CI/annotation-disconnect-apple.py --phase before
      - name: Select the unchanged installed Apple toolchain
        id: toolchain
        timeout-minutes: 8
        run: python3 Scripts/CI/select-runtime27-toolchain.py --github-env --report build/local-annotation-cloud-route/toolchain.json
      - name: Check authority, evidence, cold reader and owned process controls
        id: controls
        timeout-minutes: 3
        run: |
          set -o pipefail
          python3 Scripts/CI/test-annotation-disconnect-apple.py --artifacts-dir build/annotation-disconnect-route/python-controls 2>&1 | tee build/annotation-disconnect-route/python-controls.log
          mkdir -p build/local-annotation-cloud-route
          python3 Scripts/CI/test-local-annotation-cloud-apple.py --artifacts-dir build/local-annotation-cloud-route/python-controls 2>&1 | tee build/local-annotation-cloud-route/python-controls.log
          python3 tools/test-local-cloud-pending-sql.py --root . --output build/local-annotation-cloud-route/sql-premises/RESULT.json
      - name: Execute unchanged original local43, cold2 and owned cloud48
        id: local
        if: ${{ steps.source.outcome == 'success' && steps.toolchain.outcome == 'success' && steps.controls.outcome == 'success' }}
        continue-on-error: true
        timeout-minutes: 20
        run: python3 tools/hq-local-annotation-cloud-acceptance.py --artifacts-dir build/local-annotation-cloud-acceptance
      - name: Execute unchanged original exchange28 and two process-termination reopens
        id: exchange
        if: ${{ always() && steps.source.outcome == 'success' && steps.toolchain.outcome == 'success' && steps.controls.outcome == 'success' }}
        continue-on-error: true
        timeout-minutes: 14
        run: python3 tools/hq-annotation-exchange-acceptance.py --artifacts-dir build/local-annotation-cloud-exchange-regression
      - name: Execute exact original Repository RED and all10 repaired controls
        id: race
        if: ${{ always() && steps.source.outcome == 'success' && steps.toolchain.outcome == 'success' && steps.controls.outcome == 'success' }}
        continue-on-error: true
        timeout-minutes: 15
        run: python3 tools/hq-annotation-disconnect-acceptance.py --artifacts-dir build/annotation-disconnect-acceptance
      - name: Require every complete original and repaired gate
        if: always()
        timeout-minutes: 3
        env:
          DISCONNECT_TOOLCHAIN_OUTCOME: ${{ steps.toolchain.outcome }}
          DISCONNECT_CONTROLS_OUTCOME: ${{ steps.controls.outcome }}
          DISCONNECT_LOCAL_OUTCOME: ${{ steps.local.outcome }}
          DISCONNECT_EXCHANGE_OUTCOME: ${{ steps.exchange.outcome }}
          DISCONNECT_RACE_OUTCOME: ${{ steps.race.outcome }}
        run: python3 Scripts/CI/annotation-disconnect-apple.py --phase after
      - name: Preserve actual source, failures, markers and original owned databases
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: annotation-disconnect-original-red10-local43-cold2-cloud48-exchange28-crash2
          path: |
            build/annotation-disconnect-route/**
            build/local-annotation-cloud-route/**
            build/local-annotation-cloud-acceptance/*.json
            build/local-annotation-cloud-acceptance/*.log
            build/local-annotation-cloud-acceptance/owned-*/fixtures/**
            build/local-annotation-cloud-acceptance/owned-*/cloud-fixtures/**
            build/local-annotation-cloud-acceptance/owned-*/package/Package.swift
            build/local-annotation-cloud-acceptance/owned-*/package/Sources/**
            build/local-annotation-cloud-exchange-regression/*.json
            build/local-annotation-cloud-exchange-regression/*.log
            build/local-annotation-cloud-exchange-regression/owned-*/fixtures/**
            build/local-annotation-cloud-exchange-regression/owned-*/package/Package.swift
            build/local-annotation-cloud-exchange-regression/owned-*/package/Sources/**
            build/annotation-disconnect-acceptance/*.json
            build/annotation-disconnect-acceptance/*.log
            build/annotation-disconnect-acceptance/owned-*/fixtures/**
            build/annotation-disconnect-acceptance/owned-*/package/Package.swift
            build/annotation-disconnect-acceptance/owned-*/package/Sources/**
          if-no-files-found: error
          retention-days: 30
