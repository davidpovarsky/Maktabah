name: Original Hanlin live consumer native acceptance

on:
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: hanlin-live-native-${{ github.ref }}
  cancel-in-progress: false

jobs:
  live-native:
    name: Original app, live provider, canonical Core and native source return
    runs-on: xcode-27
    timeout-minutes: 150
    env:
      EXPECTED_CHECKOUT_SHA: ${{ github.sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - name: Verify the immutable Live13 cold-search repair source boundary
        run: python3 Scripts/CI/verify-hanlin-live13-source.py
      - name: Require the reviewed existing credential configuration
        id: live_credential
        env:
          LIVE_KEY_CONFIGURED: ${{ secrets.OTZARIA_LIVE_GEMINI_API_KEY != '' }}
        run: |
          python3 - <<'PYCONFIG'
          import os
          configured = os.environ['LIVE_KEY_CONFIGURED'] == 'true'
          with open(os.environ['GITHUB_OUTPUT'], 'a') as output:
              output.write('configured=' + str(configured).lower() + '\n')
          assert configured, 'The reviewed temporary live credential is not configured'
          PYCONFIG
      - name: Select an existing SDK-matched runtime
        run: python3 Scripts/CI/select-runtime27-toolchain.py --github-env
      - name: Verify the real Simulator App Group resolver interface
        run: |
          python3 - <<'PYGROUP'
          import hashlib, json, pathlib, subprocess
          command = ['xcrun', 'simctl', 'help', 'get_app_container']
          result = subprocess.run(command, capture_output=True, timeout=45)
          raw = result.stdout + result.stderr
          text = raw.decode('utf-8', errors='strict')
          path = pathlib.Path('build/hanlin-live-preflight/app-group-resolver-interface.json')
          path.parent.mkdir(parents=True, exist_ok=False)
          report = {'command': command, 'exit_code': result.returncode,
                    'help_sha256': hashlib.sha256(raw).hexdigest(), 'help': text,
                    'actual_installed_container_resolution': 'DEFERRED_TO_OWNED_NATIVE_FIXTURE'}
          path.write_text(json.dumps(report, indent=2) + '\n')
          assert result.returncode == 0 and len(raw) <= 65536
          assert 'get_app_container' in text and 'group' in text.lower(), 'Actual simctl group selector interface unavailable'
          PYGROUP
      - name: Select CPython supported by the original decoder wheel
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          architecture: arm64
      - name: Prepare and verify the original SQL decoder dependency
        id: live_python
        run: |
          python3 - <<'PYENV'
          import json, pathlib, platform, sys, venv
          selected = {'python_executable': sys.executable, 'python_version': sys.version,
                      'implementation': sys.implementation.name, 'system': platform.system(),
                      'machine': platform.machine()}
          print(json.dumps(selected), flush=True)
          assert sys.implementation.name == 'cpython' and sys.version_info[:2] == (3, 12)
          assert platform.system() == 'Darwin' and platform.machine() == 'arm64'
          environment = pathlib.Path('build/hanlin-live-python')
          assert not environment.exists() and not environment.is_symlink(), 'Preserve an existing Python environment'
          venv.EnvBuilder(with_pip=True).create(environment)
          PYENV
          build/hanlin-live-python/bin/python -m pip --version
          build/hanlin-live-python/bin/python -m pip install --disable-pip-version-check --only-binary=:all: zstandard==0.25.0
          build/hanlin-live-python/bin/python - <<'PYDECODER'
          import hashlib, importlib.metadata, json, pathlib, runpy, sqlite3, sys
          import zstandard
          source = pathlib.Path('Scripts/verify-otzaria-mini-parity.py')
          original = runpy.run_path(str(source))['decoder']
          sample = 'Original SQL decoder dependency preflight — מקור'.encode('utf-8')
          compressed = zstandard.ZstdCompressor().compress(sample)
          with sqlite3.connect(':memory:') as connection:
              connection.execute('CREATE TABLE zstd_dict (id INTEGER PRIMARY KEY, dict BLOB NOT NULL)')
              assert original(connection)(compressed).encode('utf-8') == sample
          report = {'status': 'ORIGINAL_DECODER_DEPENDENCY_SMOKE_PASS',
                    'python_executable': sys.executable, 'python_version': sys.version,
                    'zstandard_version': importlib.metadata.version('zstandard'),
                    'original_decoder_sha256': hashlib.sha256(source.read_bytes()).hexdigest(),
                    'compressed_sample_sha256': hashlib.sha256(compressed).hexdigest(),
                    'sample_sha256': hashlib.sha256(sample).hexdigest(),
                    'actual_native_fixture_checked': False, 'provider_called': False}
          assert report['zstandard_version'] == '0.25.0'
          pathlib.Path('build/hanlin-live-preflight/python-oracle-environment.json').write_text(json.dumps(report, indent=2) + '\n')
          PYDECODER
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.3'
      - name: Read source-pinned Zayit build mode
        id: zayit_source_mode
        run: |
          python3 - <<'PY'
          import json, os, pathlib
          rebuild = json.loads(pathlib.Path('Scripts/CI/hq-stage2-focused-apple.inputs.json').read_text()).get('rebuild_zayit_framework', False)
          assert type(rebuild) is bool
          with open(os.environ['GITHUB_OUTPUT'], 'a') as output:
              output.write('rebuild=' + str(rebuild).lower() + '\n')
          PY
      - name: Use Rust only for the reviewed matching Zayit build
        if: ${{ steps.zayit_source_mode.outputs.rebuild == 'true' }}
        uses: dtolnay/rust-toolchain@stable
      - name: Key disposable compiler cache by real SDK and native inputs
        id: runtime27_cache_key
        run: |
          python3 - <<'PY'
          import hashlib, json, os, pathlib, subprocess
          def git(path):
              return subprocess.check_output(['git', 'rev-parse', 'HEAD:' + path])
          inputs = json.loads(pathlib.Path('Scripts/CI/hq-stage2-focused-apple.inputs.json').read_text())
          inputs.pop('application_source_sha')
          inputs.pop('application_trees')
          # A package resource-layout change must not restore an older copied
          # Resources directory into a newly processed/signable bundle.
          package_manifests = subprocess.check_output(['git', 'ls-files', '-z', 'Source/**/Package.swift']).decode().split('\0')
          package_layout = b''.join(git(path) for path in package_manifests if path)
          rust = subprocess.check_output(['rustc', '-Vv']) if inputs.get('rebuild_zayit_framework') else b''
          native = (subprocess.check_output(['xcodebuild', '-version']) + git('Vendor') + git('Maktabah.xcodeproj')
                    + pathlib.Path('Podfile').read_bytes() + json.dumps(inputs, sort_keys=True).encode() + package_layout + rust)
          prefix = 'runtime27-derived-v2-' + hashlib.sha256(native).hexdigest() + '-'
          key = prefix + hashlib.sha256(git('Source') + git('Maktabah-iOSUITests')).hexdigest()
          with open(os.environ['GITHUB_OUTPUT'], 'a') as output:
              output.write('prefix=' + prefix + '\nkey=' + key + '\n')
          PY
      - uses: actions/cache/restore@v4
        id: runtime27_build_cache
        with:
          path: build/DerivedData
          key: ${{ steps.runtime27_cache_key.outputs.key }}
          restore-keys: ${{ steps.runtime27_cache_key.outputs.prefix }}
      - name: Build the original app and original UI test runner once
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python3 Scripts/CI/hq-stage2-focused-apple.py --build-for-testing --derived-data build/DerivedData
      - name: Retain compiler cache only after an actual matching test build
        id: runtime27_cache_ready
        if: always()
        env:
          EXPECTED_CHECKOUT_SHA: ${{ github.sha }}
        run: |
          python3 - <<'PY'
          import json, os, pathlib
          path = pathlib.Path('build/hq-stage2/result.json')
          report = json.loads(path.read_text()) if path.is_file() else {}
          ready = report.get('status') == 'SIMULATOR_BUILD_FOR_REAL_UI_PASS' and report.get('checkout_sha') == os.environ['EXPECTED_CHECKOUT_SHA']
          with open(os.environ['GITHUB_OUTPUT'], 'a') as output:
              output.write('ready=' + str(ready).lower() + '\n')
          PY
      - uses: actions/cache/save@v4
        if: ${{ always() && steps.runtime27_cache_ready.outputs.ready == 'true' && steps.runtime27_build_cache.outputs.cache-hit != 'true' }}
        with:
          path: build/DerivedData
          key: ${{ steps.runtime27_cache_key.outputs.key }}
      - name: Execute one original live Native case and admit bounded evidence
        id: live_case
        if: ${{ always() && steps.live_credential.outputs.configured == 'true' && steps.live_python.outcome == 'success' && steps.runtime27_cache_ready.outputs.ready == 'true' }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          OTZARIA_HANLIN_LIVE_API_KEY: ${{ secrets.OTZARIA_LIVE_GEMINI_API_KEY }}
        run: build/hanlin-live-python/bin/python Scripts/CI/runtime27-hanlin-live.py
      - name: Verify private input removal and original evidence restoration
        id: live_cleanup
        if: always()
        run: python3 Scripts/CI/runtime27-hanlin-live.py cleanup
      - name: Publish only admitted credential-scanned evidence
        if: ${{ always() && steps.live_cleanup.outcome == 'success' && hashFiles('build/hanlin-live-evidence/admission.json') != '' }}
        uses: actions/upload-artifact@v4
        with:
          name: otzaria-hanlin-live-native-evidence
          path: build/hanlin-live-evidence/
          if-no-files-found: error
