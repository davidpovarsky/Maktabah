name: Verify ChavrusaText CloudKit Production Schema

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: chavrusatext-cloudkit-production-schema-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verify-production-schema:
    name: Export and verify Production schema
    runs-on: macos-26
    timeout-minutes: 15
    env:
      APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
      CLOUDKIT_MANAGEMENT_TOKEN: ${{ secrets.CLOUDKIT_MANAGEMENT_TOKEN }}
      CLOUDKIT_CONTAINER_ID: iCloud.com.davidpovarsky.chavrusatext

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Check required secrets and cktool
        shell: bash
        run: |
          set -euo pipefail
          test -n "${APPLE_TEAM_ID:-}" || { echo "::error::Missing APPLE_TEAM_ID"; exit 1; }
          test -n "${CLOUDKIT_MANAGEMENT_TOKEN:-}" || { echo "::error::Missing CLOUDKIT_MANAGEMENT_TOKEN"; exit 1; }
          xcrun cktool export-schema --help >/dev/null

      - name: Export actual Production schema
        shell: bash
        run: |
          set -euo pipefail
          xcrun cktool export-schema \
            --team-id "$APPLE_TEAM_ID" \
            --container-id "$CLOUDKIT_CONTAINER_ID" \
            --environment production \
            --output-file production.ckdb
          test -s production.ckdb

      - name: Verify required record types and custom fields semantically
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import re
          from pathlib import Path

          expected = {
              "Annotation": {
                  "bkId": "INT64", "contentId": "INT64", "rangeLocation": "INT64",
                  "rangeLength": "INT64", "rangeDiacLocation": "INT64",
                  "rangeDiacLength": "INT64", "colorHex": "STRING", "type": "INT64",
                  "note": "STRING", "createdAt": "INT64", "context": "STRING",
                  "page": "INT64", "part": "INT64", "lastModified": "INT64",
                  "tags": "LIST<STRING>", "backendLocator": "STRING",
              },
              "SearchFolder": {
                  "name": "STRING", "lastModified": "INT64", "parentCkRecordId": "STRING",
              },
              "SearchResult": {
                  "name": "STRING", "query": "STRING", "searchMode": "INT64",
                  "nearDistance": "INT64", "archive": "INT64", "bkId": "INT64",
                  "contentId": "STRING", "lastModified": "INT64",
                  "folderCkRecordId": "STRING",
              },
              "ReadingEntry": {
                  "bookId": "INT64", "lastContentId": "INT64",
                  "lastOpenedAt": "TIMESTAMP", "favoritedAt": "TIMESTAMP",
                  "positionUpdatedAt": "TIMESTAMP", "isFavorite": "INT64",
                  "lastModified": "INT64",
              },
          }

          source = Path("production.ckdb").read_text(encoding="utf-8")
          source = re.sub(r"/\*.*?\*/", "", source, flags=re.S)
          source = re.sub(r"//.*", "", source)
          record_pattern = re.compile(
              r"RECORD\s+TYPE\s+(?:\"([^\"]+)\"|([A-Za-z_][A-Za-z0-9_]*))\s*\((.*?)\)\s*;",
              flags=re.I | re.S,
          )
          field_pattern = re.compile(
              r'^\s*(?:"([^"]+)"|([A-Za-z_][A-Za-z0-9_]*))\s+'
              r'(LIST\s*<\s*[A-Za-z][A-Za-z0-9_()]*\s*>|'
              r'[A-Za-z][A-Za-z0-9_]*(?:\(\d+\))?)(?=\s|$)',
              flags=re.I,
          )

          actual = {}
          for match in record_pattern.finditer(source):
              record_name = match.group(1) or match.group(2)
              fields = {}
              for declaration in match.group(3).split(","):
                  field_match = field_pattern.match(declaration)
                  if not field_match:
                      continue
                  field_name = field_match.group(1) or field_match.group(2)
                  if field_name.startswith("___") or field_name.upper() == "GRANT":
                      continue
                  field_type = re.sub(r"\s+", "", field_match.group(3)).upper()
                  fields[field_name] = field_type
              actual[record_name] = fields

          failures = []
          for record_name, required_fields in expected.items():
              if record_name not in actual:
                  failures.append(f"missing record type: {record_name}")
                  continue
              fields = actual[record_name]
              missing = sorted(set(required_fields) - set(fields))
              extra = sorted(set(fields) - set(required_fields))
              wrong = sorted(
                  f"{name}: expected {required_fields[name]}, found {fields[name]}"
                  for name in set(required_fields) & set(fields)
                  if fields[name] != required_fields[name]
              )
              if missing:
                  failures.append(f"{record_name} missing fields: {', '.join(missing)}")
              if extra:
                  failures.append(f"{record_name} unexpected custom fields: {', '.join(extra)}")
              failures.extend(f"{record_name}.{item}" for item in wrong)
              if len(fields) != len(required_fields):
                  failures.append(
                      f"{record_name} custom field count: expected {len(required_fields)}, found {len(fields)}"
                  )

          total = sum(len(actual.get(name, {})) for name in expected)
          if total != 35:
              failures.append(f"total required-record custom field count: expected 35, found {total}")

          if failures:
              print("::error::Production CloudKit schema mismatch")
              for failure in failures:
                  print(f"::error::{failure}")
              raise SystemExit(1)

          print("Production CloudKit schema verified semantically:")
          for name in expected:
              print(f"  {name}: {len(actual[name])} custom fields")
          print("  total: 35 custom fields")
          PY

      - name: Upload exported Production schema
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: chavrusatext-cloudkit-production-schema-${{ github.run_id }}
          path: production.ckdb
          if-no-files-found: warn
          retention-days: 30
