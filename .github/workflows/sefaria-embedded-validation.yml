name: Sefaria Embedded Real iOS Runtime Validation

on:
  push:
    branches:
      - "experiment/sefaria-mobile-original-embedded-*"
  workflow_dispatch:
    inputs:
      run_simulator_tests:
        description: Run full iPad Simulator tests
        required: true
        type: boolean
        default: true
      validation_runner:
        description: Xcode 27 acceptance, or macOS 26 SDK diagnostics (cannot satisfy iPadOS 27 gate)
        required: true
        type: choice
        default: xcode-27
        options:
          - xcode-27
          - macos-26
      source_ref:
        description: Optional immutable baseline SHA for original-app visual comparison; empty builds this commit
        required: false
        type: string
        default: ''
      run_production_release:
        description: After the Debug UI matrix, validate a Release binary over the full native production corpus
        required: true
        type: boolean
        default: false
      ui_sdk_check_only:
        description: Only typecheck the black-box XCTest sources; never counts as app/runtime acceptance
        required: true
        type: boolean
        default: false

permissions:
  actions: read
  contents: read

concurrency:
  group: sefaria-embedded-val-${{ github.ref }}-${{ inputs.ui_sdk_check_only && 'ui-sdk-only' || inputs.source_ref || 'candidate' }}-${{ inputs.validation_runner || 'xcode-27' }}
  cancel-in-progress: true

jobs:
  ui-sdk-check-only:
    name: Focused XCTest SDK typecheck (no app/runtime acceptance)
    if: ${{ inputs.ui_sdk_check_only }}
    runs-on: ${{ inputs.validation_runner || 'xcode-27' }}
    timeout-minutes: 15
    steps:
      - name: Reject conflicting acceptance inputs
        if: ${{ inputs.run_production_release || inputs.source_ref != '' }}
        run: |
          echo "::error::SDK-only mode cannot request baseline or production acceptance."
          exit 1
      - uses: actions/checkout@v4
      - name: Typecheck black-box tests with the actual iPad SDK
        run: python3 Scripts/CI/typecheck-faithful-ui-tests.py
      - name: Upload exact SDK and compiler diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: faithful-ui-sdk-check
          path: build/artifacts/ui-acceptance-typecheck.*

  validate-sefaria-embedded:
    name: Validate Sefaria-Mobile Embedded Build and Runtime
    if: ${{ !inputs.ui_sdk_check_only }}
    runs-on: ${{ inputs.validation_runner || 'xcode-27' }}
    timeout-minutes: 360

    steps:
      - name: Require Debug UI acceptance before the production Release gate
        if: ${{ inputs.run_production_release && !inputs.run_simulator_tests }}
        run: |
          echo "::error::Production Release acceptance requires the real Debug UI matrix in the same run."
          exit 1

      - name: Checkout Repository with Submodules
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 1
          ref: ${{ inputs.source_ref || github.sha }}

      - name: Stage black-box visual tests for an immutable baseline
        if: ${{ inputs.source_ref != '' }}
        env:
          TEST_SOURCE_SHA: ${{ github.sha }}
          BASELINE_SOURCE_SHA: ${{ inputs.source_ref }}
        run: |
          set -euo pipefail
          test "$BASELINE_SOURCE_SHA" = f092f3996927251d105dfb9243dfac487b196534
          test "$(git rev-parse HEAD)" = "$BASELINE_SOURCE_SHA"
          git fetch --no-tags --depth=1 origin "$TEST_SOURCE_SHA"
          git show "$TEST_SOURCE_SHA:Maktabah-iOSUITests/FaithfulReaderUIAcceptanceTests.swift" > Maktabah-iOSUITests/FaithfulReaderUIAcceptanceTests.swift
          git show "$TEST_SOURCE_SHA:Maktabah-iOSUITests/MaktabahUITestBase.swift" > Maktabah-iOSUITests/MaktabahUITestBase.swift
          git show "$TEST_SOURCE_SHA:Scripts/CI/prepare-faithful-ipad-fixtures.py" > Scripts/CI/prepare-faithful-ipad-fixtures.py
          git show "$TEST_SOURCE_SHA:Scripts/CI/run-faithful-ipad-matrix.py" > Scripts/CI/run-faithful-ipad-matrix.py
          git show "$TEST_SOURCE_SHA:Scripts/CI/verify-faithful-xctest.py" > Scripts/CI/verify-faithful-xctest.py
          git show "$TEST_SOURCE_SHA:Scripts/CI/typecheck-faithful-ui-tests.py" > Scripts/CI/typecheck-faithful-ui-tests.py
          git show "$TEST_SOURCE_SHA:Scripts/CI/build-faithful-prototype-reference.py" > Scripts/CI/build-faithful-prototype-reference.py
          git show "$TEST_SOURCE_SHA:Scripts/CI/shutdown-faithful-simulator.py" > Scripts/CI/shutdown-faithful-simulator.py
          git show "$TEST_SOURCE_SHA:Scripts/CI/collect-faithful-simulator-failure.py" > Scripts/CI/collect-faithful-simulator-failure.py
          mkdir -p tools/faithful-ui-reference
          git show "$TEST_SOURCE_SHA:tools/faithful-ui-reference/MyApp.swift" > tools/faithful-ui-reference/MyApp.swift
          mkdir -p build/artifacts
          git rev-parse HEAD > build/artifacts/app-source-sha.txt
          printf '%s\n' "$TEST_SOURCE_SHA" > build/artifacts/black-box-test-source-sha.txt

      - name: Typecheck black-box UI tests before building the app
        if: ${{ github.event_name != 'workflow_dispatch' || inputs.run_simulator_tests }}
        run: python3 Scripts/CI/typecheck-faithful-ui-tests.py

      - name: Test original source ports on the actual iPad SDK
        if: ${{ inputs.source_ref == '' && (github.event_name != 'workflow_dispatch' || inputs.run_simulator_tests) }}
        timeout-minutes: 20
        run: |
          set -euo pipefail
          mkdir -p build/artifacts
          python3 Scripts/CI/select-ipad-simulator.py --out sim_udid.txt
          SIM_UDID=$(cat sim_udid.txt)
          python3 Scripts/CI/test-faithful-tabs-in-app.py
          cd "$GITHUB_WORKSPACE/Source/ChavrusaText/Dependencies/CommandPalette"
          xcodebuild test -scheme CommandPalette -destination "platform=iOS Simulator,id=$SIM_UDID" -resultBundlePath "$GITHUB_WORKSPACE/build/artifacts/command-palette.xcresult"
          python3 "$GITHUB_WORKSPACE/Scripts/CI/shutdown-faithful-simulator.py" "$SIM_UDID"

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Verify Upstream Submodule State
        run: |
          echo "=== Submodule Status ==="
          git submodule status Vendor/SefariaMobile/Upstream
          SUBMODULE_SHA=$(git -C Vendor/SefariaMobile/Upstream rev-parse HEAD)
          echo "Pinned submodule SHA: ${SUBMODULE_SHA}"
          if [ "${SUBMODULE_SHA}" != "2fd173a5a3bd32d94a9ba1222e4e32a37f6bd23c" ]; then
            echo "::error::Submodule SHA mismatch! Expected 2fd173a5a3bd32d94a9ba1222e4e32a37f6bd23c, got ${SUBMODULE_SHA}"
            exit 1
          fi

      - name: Install Sefaria-Mobile JS Dependencies
        working-directory: Vendor/SefariaMobile/Upstream
        run: |
          echo "=== Running npm ci in Sefaria-Mobile Upstream ==="
          npm ci --legacy-peer-deps

      - name: Build Metro JS Production Bundle
        run: |
          echo "=== Building Metro bundle from index.embedded.js ==="
          mkdir -p build/jsbundle
          cd Vendor/SefariaMobile/Upstream
          export NODE_PATH="${PWD}/node_modules"
          npx react-native bundle \
            --config ../Integration/metro.config.embedded.js \
            --platform ios \
            --dev false \
            --entry-file ../Integration/index.embedded.js \
            --bundle-output ../../../build/jsbundle/main.jsbundle \
            --assets-dest ../../../build/jsbundle
          
          if [ ! -s "../../../build/jsbundle/main.jsbundle" ]; then
            echo "::error::Metro bundle output is missing or empty!"
            exit 1
          fi
          echo "Metro bundle generated successfully ($(wc -c < ../../../build/jsbundle/main.jsbundle | tr -d ' ') bytes)."

      - name: Verify Upstream Sefaria Resources
        run: |
          python3 Scripts/verify-sefaria-bundle-resources.py \
            Vendor/SefariaMobile/Upstream/ios/sources \
            --manifest-out build/sefaria-source-manifest.json

      - name: Run Portable Swift Component Tests
        run: |
          echo "=== Running 317 Swift Component & RPC Contract Tests ==="
          chmod +x Scripts/run-chavrusa-component-tests.sh
          bash Scripts/run-chavrusa-component-tests.sh

      - name: Test actual workspace persistence and canonical navigation presentation
        if: ${{ inputs.source_ref == '' }}
        run: python3 Scripts/CI/test-faithful-workspace.py

      - name: Setup Ruby and CocoaPods
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.3'
          bundler-cache: true

      - name: Install CocoaPods Dependencies
        run: |
          echo "=== Symlinking node_modules and Expo manifests for relative path resolution ==="
          ln -sfn "${PWD}/Vendor/SefariaMobile/Upstream/node_modules" "${PWD}/../node_modules"
          ln -sfn "${PWD}/Vendor/SefariaMobile/Upstream/node_modules" "${PWD}/node_modules"
          ln -sfn "${PWD}/Vendor/SefariaMobile/Upstream/package.json" "${PWD}/package.json"
          ln -sfn "${PWD}/Vendor/SefariaMobile/Upstream/app.json" "${PWD}/app.json"
          ln -sfn "${PWD}/Vendor/SefariaMobile/Upstream/metro.config.js" "${PWD}/metro.config.js"
          ln -sfn "${PWD}/Vendor/SefariaMobile/Upstream/babel.config.js" "${PWD}/babel.config.js"
          
          echo "=== Setting script permissions ==="
          chmod -R +x "${PWD}/Vendor/SefariaMobile/Upstream/node_modules/.bin" || true
          chmod -R +x "${PWD}/Vendor/SefariaMobile/Upstream/node_modules/expo/bin" || true
          
          echo "=== Staging GoogleService-Info.plist for CocoaPods and build ==="
          cp Source/GoogleService-Info.plist "${PWD}/GoogleService-Info.plist" || true
          cp Source/GoogleService-Info.plist "${PWD}/Vendor/SefariaMobile/Upstream/ios/GoogleService-Info.plist" || true

          echo "PROJECT_ROOT=${PWD}/Vendor/SefariaMobile/Upstream" >> $GITHUB_ENV
          echo "NODE_PATH=${PWD}/Vendor/SefariaMobile/Upstream/node_modules" >> $GITHUB_ENV
          echo "RCT_NO_LAUNCH_PACKAGER=1" >> $GITHUB_ENV
          echo "SKIP_BUNDLING=1" >> $GITHUB_ENV
          echo "GOOGLE_SERVICES_FILE=${PWD}/Source/GoogleService-Info.plist" >> $GITHUB_ENV

          echo "=== Running pod install ==="
          export NODE_PATH="${PWD}/Vendor/SefariaMobile/Upstream/node_modules"
          pod install
          chmod -R +x "${PWD}/Pods/Target Support Files" || true

      - name: Download Otzaria Search XCFramework
        uses: actions/download-artifact@v4
        with:
          name: ios-build-otzaria-xcframework
          path: build/artifacts
          github-token: ${{ secrets.GITHUB_TOKEN }}
          repository: davidpovarsky/Maktabah
          run-id: 40566258679

      - name: Download Zayit Search XCFramework
        uses: actions/download-artifact@v4
        with:
          name: ios-build-zayit-xcframework
          path: build/artifacts
          github-token: ${{ secrets.GITHUB_TOKEN }}
          repository: davidpovarsky/Maktabah
          run-id: 40566258679

      - name: Download matching resolved Swift packages
        uses: actions/download-artifact@v4
        with:
          name: ios-build-swift-packages
          path: build/artifacts
          github-token: ${{ secrets.GITHUB_TOKEN }}
          repository: davidpovarsky/Maktabah
          run-id: 40566258679

      - name: Restore and Verify Search XCFrameworks and Swift Packages
        run: |
          set -euo pipefail
          echo "=== Restoring search engine XCFrameworks and Swift Packages ==="
          mkdir -p Vendor/ZayitSearchPort/build build
          tar -C Vendor/OtzariaSearchEngine -xf build/artifacts/OtzariaSearchEngine.xcframework.tar
          tar -C Vendor/ZayitSearchPort/build -xf build/artifacts/MaktabahZayitSearch.xcframework.tar
          tar -C build -xf build/artifacts/SourcePackages.tar
          bash Scripts/CI/verify-xcframework.sh Vendor/OtzariaSearchEngine/OtzariaSearchEngine.xcframework otzaria_search_engine.h
          bash Scripts/CI/verify-xcframework.sh Vendor/ZayitSearchPort/build/MaktabahZayitSearch.xcframework maktabah_zayit_search.h
          python3 Scripts/CI/prepare-swift-packages.py

      - name: Resolve exact candidate Swift packages
        if: ${{ inputs.source_ref == '' }}
        run: |
          set -euo pipefail
          xcodebuild -resolvePackageDependencies -workspace Maktabah.xcworkspace -scheme Maktabah-iOS -clonedSourcePackagesDirPath build/SourcePackages
          plutil -lint Maktabah.xcodeproj/project.pbxproj

      - name: Build Maktabah-iOS for iPad Simulator
        run: |
          echo "=== Building Maktabah-iOS for Simulator ==="
          export PROJECT_ROOT="${PWD}/Vendor/SefariaMobile/Upstream"
          export NODE_PATH="${PWD}/Vendor/SefariaMobile/Upstream/node_modules"
          export RCT_NO_LAUNCH_PACKAGER=1
          export SKIP_BUNDLING=1
          export GOOGLE_SERVICES_FILE="${PWD}/Source/GoogleService-Info.plist"
          cp Source/GoogleService-Info.plist "${PWD}/GoogleService-Info.plist" || true
          cp Source/GoogleService-Info.plist "${PWD}/Vendor/SefariaMobile/Upstream/ios/GoogleService-Info.plist" || true
          JOBS="$(sysctl -n hw.ncpu)"
          [ "$JOBS" -le 8 ] || JOBS=8
          xcodebuild build-for-testing \
            -workspace Maktabah.xcworkspace \
            -scheme Maktabah-iOS \
            -configuration Debug \
            -sdk iphonesimulator \
            -destination "generic/platform=iOS Simulator" \
            -derivedDataPath build/DerivedData \
            -clonedSourcePackagesDirPath build/SourcePackages \
            -disableAutomaticPackageResolution \
            -parallelizeTargets -jobs "$JOBS" -showBuildTimingSummary \
            CODE_SIGN_IDENTITY="-" CODE_SIGNING_REQUIRED=YES CODE_SIGNING_ALLOWED=YES \
            COMPILER_INDEX_STORE_ENABLE=NO \
            ONLY_ACTIVE_ARCH=YES ARCHS=arm64 \
            ENABLE_USER_SCRIPT_SANDBOXING=NO \
            RCT_NO_LAUNCH_PACKAGER=1 SKIP_BUNDLING=1 \
            FAIL_ON_MISSING_BUNDLE=1 \
            PROJECT_ROOT="${PWD}/Vendor/SefariaMobile/Upstream"

      - name: Verify App Bundle Staged Resources
        run: |
          echo "=== Verifying built app bundle resources ==="
          BUILT_APP="build/DerivedData/Build/Products/Debug-iphonesimulator/Maktabah.app"
          if [ ! -d "${BUILT_APP}" ]; then
            BUILT_APP=$(find build -name "Maktabah.app" -type d | head -n 1)
          fi
          if [ -n "${BUILT_APP}" ] && [ -d "${BUILT_APP}" ]; then
            echo "Found built app at: ${BUILT_APP}"
            chmod +x Scripts/copy-sefaria-bundle-resources.sh
            bash Scripts/copy-sefaria-bundle-resources.sh "${BUILT_APP}"
            python3 Scripts/verify-sefaria-bundle-resources.py \
              "${BUILT_APP}" \
              --require-bundle \
              --manifest-out build/sefaria-app-bundle-manifest.json
            echo "Ad-hoc signing built app and test runner..."
            codesign --force --deep --sign - "${BUILT_APP}"
            RUNNER="build/DerivedData/Build/Products/Debug-iphonesimulator/Maktabah-iOSUITests-Runner.app"
            if [ -d "${RUNNER}" ]; then
              codesign --force --deep --sign - "${RUNNER}"
            fi
          else
            echo "::error::Maktabah.app not found at expected path!"
            exit 1
          fi

      - name: Boot iPad Simulator and Verify App Launch
        timeout-minutes: 15
        run: |
          set -euo pipefail
          echo "=== Discovering available iPad Simulator ==="
          xcrun simctl list runtimes
          python3 Scripts/CI/select-ipad-simulator.py --out sim_udid.txt
          SIM_UDID=$(cat sim_udid.txt)
          echo "Booting simulator: ${SIM_UDID}"
          xcrun simctl boot "${SIM_UDID}" || true
          xcrun simctl bootstatus "${SIM_UDID}" -b
          
          BUILT_APP="build/DerivedData/Build/Products/Debug-iphonesimulator/Maktabah.app"
          if [ ! -d "${BUILT_APP}" ]; then
            BUILT_APP=$(find build -name "Maktabah.app" -type d | head -n 1)
          fi
          
          echo "Installing ${BUILT_APP} into simulator..."
          xcrun simctl install "${SIM_UDID}" "${BUILT_APP}"
          
          echo "Launching com.davidpovarsky.chavrusatext on simulator with sefariaEmbedded backend..."
          xcrun simctl launch "${SIM_UDID}" com.davidpovarsky.chavrusatext -smokeBackend sefariaEmbedded -smokeScenario catalog
          
          sleep 8
          echo "Verifying process is running..."
          xcrun simctl spawn "${SIM_UDID}" ps aux | grep "Maktabah" || true
          
          echo "Capturing simulator launch screenshot..."
          mkdir -p build/artifacts
          xcrun simctl io "${SIM_UDID}" screenshot build/artifacts/simulator-launch.png || true
          
          echo "Collecting simulator process logs..."
          xcrun simctl spawn "${SIM_UDID}" log show --predicate 'process == "Maktabah"' --style compact --last 2m > build/artifacts/simulator-app.log || true

          echo "Terminating standalone launch before running test runner..."
          xcrun simctl terminate "${SIM_UDID}" com.davidpovarsky.chavrusatext || true
          python3 Scripts/CI/shutdown-faithful-simulator.py "${SIM_UDID}"

      - name: Build the supplied original prototype as an isolated visual oracle
        if: ${{ github.event_name != 'workflow_dispatch' || inputs.run_simulator_tests }}
        run: python3 Scripts/CI/build-faithful-prototype-reference.py

      - name: Run genuine native UI and visual matrix on 11 and 13 inch iPads
        id: faithful_ui_matrix
        if: ${{ github.event_name != 'workflow_dispatch' || inputs.run_simulator_tests }}
        timeout-minutes: 110
        env:
          VALIDATING_BASELINE: ${{ inputs.source_ref != '' }}
          GH_TOKEN: ${{ github.token }}
        run: python3 Scripts/CI/run-faithful-ipad-matrix.py
      - name: Full native production corpus and Release UI acceptance
        if: ${{ inputs.run_production_release && inputs.source_ref == '' && steps.faithful_ui_matrix.outcome == 'success' }}
        timeout-minutes: 120
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 Scripts/CI/run-faithful-production-release.py

      - name: Capture preflight Simulator failure before artifact upload
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ -f sim_udid.txt ] && [ ! -f build/artifacts/faithful-ipad-matrix.json ]; then
            python3 Scripts/CI/collect-faithful-simulator-failure.py "$(cat sim_udid.txt)" preflight
          fi

      - name: Upload Build & Verification Manifests
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sefaria-embedded-validation-manifests
          path: |
            build/sefaria-source-manifest.json
            build/sefaria-app-bundle-manifest.json
            build/jsbundle/main.jsbundle
            build/artifacts/simulator-launch.png
            build/artifacts/simulator-app.log
            build/artifacts/simulator-failure-*
            build/artifacts/test-simulator.log
            build/artifacts/result*.xcresult
            build/artifacts/test-simulator-*.log
            build/artifacts/test-case-execution-*.json
            build/artifacts/ui-acceptance-typecheck.*
            build/artifacts/miniTest10-native-fixture-install-*.json
            build/artifacts/faithful-ipad-matrix.json
            build/artifacts/simctl-ui-help.txt
            build/artifacts/prototype-reference-manifest.json
            build/artifacts/workspace-compile.log
            build/artifacts/workspace-test-results.log
            build/artifacts/production-release.xcresult
            build/artifacts/production-release-tests.log
            build/artifacts/production-release-acceptance.json
            build/artifacts/production-native-fixture-install.json
            build/artifacts/visual-*
            build/artifacts/viewport-reports-*
            build/artifacts/duck-tabs.xcresult
            build/artifacts/command-palette.xcresult
            build/artifacts/app-source-sha.txt
            build/artifacts/black-box-test-source-sha.txt
            build/artifacts/miniTest10-native-fixture-install.json
            docs/ipad-ui-rebuild
            SOURCE_TO_PORT_DIFF.md
