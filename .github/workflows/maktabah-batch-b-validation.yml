name: "Maktabah Batch B macOS 27 Xcode 27 Validation"

on:
  push:
    branches:
      - "validation/maktabah-batch-b-*"
      - "validation/maktabah-build-8401-*"
  workflow_dispatch:

permissions:
  contents: read

env:
  PROJECT_PATH: Maktabah.xcodeproj
  SCHEME: Maktabah-iOS
  PRODUCT_NAME: Maktabah
  CARGO_TERM_COLOR: always

jobs:
  env-check:
    name: Verify macOS 27 and Xcode 27 Runner Environment
    runs-on: xcode-27
    timeout-minutes: 15
    steps:
      - name: System and Toolchain Diagnostics
        run: |
          echo "=== System Information ==="
          sw_vers
          uname -m
          echo "=== Xcode Toolchain ==="
          xcodebuild -version
          xcodebuild -showsdks
          echo "=== Available iOS Simulators ==="
          xcrun simctl list devices available

          MACOS_VER=$(sw_vers -productVersion | cut -d. -f1)
          ARCH=$(uname -m)
          XCODE_VER=$(xcodebuild -version | head -n 1 | awk '{print $2}' | cut -d. -f1)

          echo "Verified: macOS $MACOS_VER ($ARCH), Xcode $XCODE_VER"
          if [ "$MACOS_VER" != "27" ]; then
            echo "::error::Expected macOS 27 host, found $MACOS_VER"
            exit 1
          fi
          if [ "$ARCH" != "arm64" ]; then
            echo "::error::Expected Apple Silicon arm64 runner, found $ARCH"
            exit 1
          fi
          if [ "$XCODE_VER" != "27" ]; then
            echo "::error::Expected Xcode 27, found $XCODE_VER"
            exit 1
          fi

  otzaria-framework:
    name: Build or restore Otzaria framework on Xcode 27
    needs: [env-check]
    runs-on: xcode-27
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Identify Toolchains
        id: toolchains
        run: |
          echo "xcode=$(xcodebuild -version | shasum -a 256 | cut -d' ' -f1)" >> "$GITHUB_OUTPUT"

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-ios, aarch64-apple-ios-sim, x86_64-apple-ios

      - name: Identify Rust toolchain
        id: rustc
        run: echo "id=$(rustc -Vv | shasum -a 256 | cut -d' ' -f1)" >> "$GITHUB_OUTPUT"

      - name: Cache Cargo registry
        id: cargo-registry
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: ${{ runner.os }}-${{ runner.arch }}-cargo-reg-xcode27-${{ hashFiles('Vendor/OtzariaSearchEngine/ios_bridge/Cargo.lock') }}

      - name: Cache production Otzaria framework
        id: framework-cache
        uses: actions/cache@v4
        with:
          path: |
            Vendor/OtzariaSearchEngine/OtzariaSearchEngine.xcframework
            Vendor/OtzariaSearchEngine/ios_bridge/target
          key: ${{ runner.os }}-${{ runner.arch }}-xcode27-${{ steps.toolchains.outputs.xcode }}-otzaria-framework-${{ steps.rustc.outputs.id }}-${{ hashFiles('Vendor/OtzariaSearchEngine/Upstream/**', 'Vendor/OtzariaSearchEngine/Resources/**', 'Vendor/OtzariaSearchEngine/build_xcframework.sh', 'Vendor/OtzariaSearchEngine/ios_bridge/Cargo.toml', 'Vendor/OtzariaSearchEngine/ios_bridge/Cargo.lock', 'Vendor/OtzariaSearchEngine/ios_bridge/build.rs', 'Vendor/OtzariaSearchEngine/ios_bridge/src/**', 'Vendor/OtzariaSearchEngine/include/**', 'Vendor/OtzariaSearchEngine/module.modulemap') }}

      - name: Validate restored Otzaria framework
        id: framework-valid
        run: |
          if bash Scripts/CI/verify-xcframework.sh Vendor/OtzariaSearchEngine/OtzariaSearchEngine.xcframework otzaria_search_engine.h; then
            echo "valid=true" >> "$GITHUB_OUTPUT"
          else
            rm -rf Vendor/OtzariaSearchEngine/OtzariaSearchEngine.xcframework Vendor/OtzariaSearchEngine/ios_bridge/target
            echo "valid=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Materialize pinned Otzaria upstream checkout
        run: bash Scripts/CI/ensure-otzaria-upstream-checkout.sh

      - name: Build Otzaria production semantic XCFramework
        if: steps.framework-valid.outputs.valid != 'true'
        run: bash Vendor/OtzariaSearchEngine/build_xcframework.sh

      - name: Verify Otzaria framework
        run: |
          bash Scripts/CI/verify-xcframework.sh Vendor/OtzariaSearchEngine/OtzariaSearchEngine.xcframework otzaria_search_engine.h

      - name: Package Otzaria framework
        run: |
          mkdir -p build/artifacts
          tar -C Vendor/OtzariaSearchEngine -cf build/artifacts/OtzariaSearchEngine.xcframework.tar OtzariaSearchEngine.xcframework

      - uses: actions/upload-artifact@v4
        with:
          name: ios-build-otzaria-xcframework
          path: build/artifacts/OtzariaSearchEngine.xcframework.tar
          compression-level: 0
          if-no-files-found: error

  zayit-framework:
    name: Build or restore Zayit framework on Xcode 27
    needs: [env-check]
    runs-on: xcode-27
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: Identify Toolchains
        id: toolchains
        run: |
          echo "xcode=$(xcodebuild -version | shasum -a 256 | cut -d' ' -f1)" >> "$GITHUB_OUTPUT"

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-ios, aarch64-apple-ios-sim, x86_64-apple-ios

      - name: Identify Rust toolchain
        id: rustc
        run: echo "id=$(rustc -Vv | shasum -a 256 | cut -d' ' -f1)" >> "$GITHUB_OUTPUT"

      - name: Cache Cargo registry
        id: cargo-registry
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: ${{ runner.os }}-${{ runner.arch }}-cargo-reg-zayit-xcode27-${{ hashFiles('Vendor/ZayitSearchPort/Rust/Cargo.lock') }}

      - name: Cache Zayit framework
        id: framework-cache
        uses: actions/cache@v4
        with:
          path: |
            Vendor/ZayitSearchPort/build/MaktabahZayitSearch.xcframework
            Vendor/ZayitSearchPort/Rust/target
          key: ${{ runner.os }}-${{ runner.arch }}-xcode27-${{ steps.toolchains.outputs.xcode }}-zayit-framework-${{ steps.rustc.outputs.id }}-${{ hashFiles('Vendor/ZayitSearchPort/Rust/Cargo.toml', 'Vendor/ZayitSearchPort/Rust/Cargo.lock', 'Vendor/ZayitSearchPort/Rust/src/**', 'Vendor/ZayitSearchPort/Rust/include/**', 'Vendor/ZayitSearchPort/Scripts/build-ios-xcframework.sh') }}

      - name: Validate restored Zayit framework
        id: framework-valid
        run: |
          if bash Scripts/CI/verify-xcframework.sh Vendor/ZayitSearchPort/build/MaktabahZayitSearch.xcframework maktabah_zayit_search.h; then
            echo "valid=true" >> "$GITHUB_OUTPUT"
          else
            rm -rf Vendor/ZayitSearchPort/build/MaktabahZayitSearch.xcframework Vendor/ZayitSearchPort/Rust/target
            echo "valid=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Build Zayit XCFramework
        if: steps.framework-valid.outputs.valid != 'true'
        run: bash Vendor/ZayitSearchPort/Scripts/build-ios-xcframework.sh

      - name: Verify Zayit framework
        run: bash Scripts/CI/verify-xcframework.sh Vendor/ZayitSearchPort/build/MaktabahZayitSearch.xcframework maktabah_zayit_search.h

      - name: Package Zayit framework
        run: |
          mkdir -p build/artifacts
          tar -C Vendor/ZayitSearchPort/build -cf build/artifacts/MaktabahZayitSearch.xcframework.tar MaktabahZayitSearch.xcframework

      - uses: actions/upload-artifact@v4
        with:
          name: ios-build-zayit-xcframework
          path: build/artifacts/MaktabahZayitSearch.xcframework.tar
          compression-level: 0
          if-no-files-found: error

  swiftpm:
    name: Resolve Swift packages on Xcode 27
    needs: [env-check]
    runs-on: xcode-27
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Identify Toolchains
        id: cache-inputs
        run: |
          echo "xcode=$(xcodebuild -version | shasum -a 256 | cut -d' ' -f1)" >> "$GITHUB_OUTPUT"
          echo "swiftpm=$(python3 Scripts/CI/cache-key-inputs.py swiftpm)" >> "$GITHUB_OUTPUT"

      - name: Cache Swift package dependencies
        id: swiftpm-cache
        uses: actions/cache@v4
        with:
          path: |
            ~/Library/Caches/org.swift.swiftpm
            ~/Library/org.swift.swiftpm
            build/SourcePackages
          key: ${{ runner.os }}-${{ runner.arch }}-swiftpm-xcode27-${{ steps.cache-inputs.outputs.xcode }}-${{ steps.cache-inputs.outputs.swiftpm }}

      - name: Resolve package dependencies
        run: |
          xcodebuild -resolvePackageDependencies \
            -project "$PROJECT_PATH" \
            -scheme "$SCHEME" \
            -clonedSourcePackagesDirPath build/SourcePackages

      - name: Package resolved sources
        run: |
          mkdir -p build/artifacts
          tar -C build -cf build/artifacts/SourcePackages.tar SourcePackages

      - uses: actions/upload-artifact@v4
        with:
          name: ios-build-swift-packages
          path: build/artifacts/SourcePackages.tar
          compression-level: 0
          if-no-files-found: error

  simulator-build-and-test:
    name: Build & Test Simulator on Xcode 27
    needs: [otzaria-framework, zayit-framework, swiftpm]
    runs-on: xcode-27
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/download-artifact@v4
        with:
          pattern: ios-build-*
          path: build/artifacts
          merge-multiple: true

      - name: Restore build inputs
        run: |
          mkdir -p Vendor/ZayitSearchPort/build build build/logs
          tar -C Vendor/OtzariaSearchEngine -xf build/artifacts/OtzariaSearchEngine.xcframework.tar
          tar -C Vendor/ZayitSearchPort/build -xf build/artifacts/MaktabahZayitSearch.xcframework.tar
          tar -C build -xf build/artifacts/SourcePackages.tar
          bash Scripts/CI/verify-xcframework.sh Vendor/OtzariaSearchEngine/OtzariaSearchEngine.xcframework otzaria_search_engine.h
          bash Scripts/CI/verify-xcframework.sh Vendor/ZayitSearchPort/build/MaktabahZayitSearch.xcframework maktabah_zayit_search.h
          python3 Scripts/CI/verify-otzaria-xcode-project.py

      # Note: Cryptographic boundary verification is governed by boundary-guard-diagnostic and ios-testflight gates

      - name: Run ChavrusaText Component Tests
        run: |
          swiftc -parse-as-library -o /tmp/chavrusa_tests \
            tools/test_chavrusa_text_components.swift \
            Source/ChavrusaText/ReaderRendering/ReaderPullNavigationStateMachine.swift \
            Source/ChavrusaText/ReaderRendering/ReaderSelectionRangeMapper.swift \
            Source/ChavrusaText/Annotations/BackendAnnotationBridge.swift \
            Source/ChavrusaText/Navigation/ReaderSessionRestoreCoordinator.swift \
            Source/ChavrusaText/Navigation/SerializedSessionWriter.swift \
            Source/ChavrusaText/Navigation/BackendNavigationAdapter.swift \
            Source/ChavrusaText/Localization/ChavrusaTextLocalizationResolver.swift \
            Source/ChavrusaText/Localization/TalmudHebrewAddressFormatter.swift \
            Source/ChavrusaText/Navigation/ReaderDestinationResolver.swift \
            Source/ChavrusaText/Navigation/ReaderBackendPagingCoordinator.swift \
            Source/ChavrusaText/Navigation/ReaderContentLoadCoordinator.swift \
            Source/ChavrusaText/Search/ReaderSearchContextCoordinator.swift \
            Source/ChavrusaText/Navigation/TOCReadingLocationTracker.swift \
            Source/ChavrusaText/Navigation/TargetBackendBookResolver.swift \
            Source/ChavrusaText/Testing/ReaderRenderedHighlightInspector.swift \
            Source/Sefaria/Domain/SefariaModels.swift \
            Source/Sefaria/Offline/SefariaExportModels.swift \
            Source/Sefaria/Offline/SefariaOfflinePaths.swift \
            Source/LibraryBackend/LibraryBackendProtocols.swift \
            Source/LibraryBackend/LibraryBackendModels.swift \
            Source/LibraryBackend/LibraryPresentationPolicy+Display.swift \
            Source/LibraryBackend/LegacyIdentityRegistry.swift \
            Source/LibraryBackend/BackendCoordinator.swift
          /tmp/chavrusa_tests

      - name: Build Maktabah-iOS for Testing on Simulator (Debug)
        run: |
          JOBS="$(sysctl -n hw.ncpu)"
          [ "$JOBS" -le 8 ] || JOBS=8
          set -o pipefail
          xcodebuild build-for-testing \
            -project "$PROJECT_PATH" \
            -scheme "$SCHEME" \
            -configuration Debug \
            -sdk iphonesimulator \
            -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath build/DerivedData \
            -clonedSourcePackagesDirPath build/SourcePackages \
            -disableAutomaticPackageResolution \
            OTZARIA_DEFAULT_DATA_PROFILE=miniTest10 \
            -parallelizeTargets -jobs "$JOBS" -showBuildTimingSummary \
            CODE_SIGN_IDENTITY="-" CODE_SIGNING_REQUIRED=YES CODE_SIGNING_ALLOWED=YES \
            2>&1 | tee build/logs/build-simulator.log

          APP="build/DerivedData/Build/Products/Debug-iphonesimulator/${PRODUCT_NAME}.app"
          test -d "$APP"
          test -f "$APP/dictionary.json"
          test -f "$APP/Acronyms.json"
          /usr/libexec/PlistBuddy -c 'Set :OtzariaDefaultDataProfile miniTest10' "$APP/Info.plist" 2>/dev/null || /usr/libexec/PlistBuddy -c 'Add :OtzariaDefaultDataProfile string miniTest10' "$APP/Info.plist"
          codesign --force --deep --sign - "$APP"
          RUNNER="build/DerivedData/Build/Products/Debug-iphonesimulator/Maktabah-iOSUITests-Runner.app"
          if [ -d "$RUNNER" ]; then
            codesign --force --deep --sign - "$RUNNER"
          fi
          echo "Simulator build-for-testing successful and ad-hoc signed: $APP"

      - name: Run Genuine iPad Simulator Acceptance Tests (Fail-Closed)
        run: |
          set -o pipefail
          echo "=== Discovering iPad Simulator on iOS 27 ==="
          IPAD_UDID=$(xcrun simctl list devices available -j | python3 -c "import json, sys; devs = [d for r, dl in json.load(sys.stdin).get('devices', {}).items() if 'iOS' in r for d in dl if d.get('isAvailable') and 'iPad' in d.get('name', '')]; print(next((d['udid'] for d in devs if 'iPad Pro 13-inch' in d['name']), next((d['udid'] for d in devs if 'iPad Pro' in d['name']), devs[0]['udid'])))")
          if [ -z "$IPAD_UDID" ]; then
            echo "::error::Required iPad simulator unavailable on iOS 27 runtime"
            exit 1
          fi
          echo "Selected iPad Simulator UDID: $IPAD_UDID"
          xcrun simctl boot "$IPAD_UDID" || true
          xcrun simctl bootstatus "$IPAD_UDID" -b

          APP="build/DerivedData/Build/Products/Debug-iphonesimulator/${PRODUCT_NAME}.app"
          echo "Pre-installing app on simulator..."
          xcrun simctl install "$IPAD_UDID" "$APP"

          TEST_EXIT=0
          xcodebuild test-without-building \
            -project "$PROJECT_PATH" \
            -scheme "$SCHEME" \
            -configuration Debug \
            -destination "platform=iOS Simulator,id=$IPAD_UDID" \
            -derivedDataPath build/DerivedData \
            -resultBundlePath build/DerivedData/TestResults.xcresult \
            2>&1 | tee build/logs/test-simulator.log || TEST_EXIT=$?

          if [ "$TEST_EXIT" -ne 0 ]; then
            echo "=== Simulator Crash Reports ==="
            ls -la ~/Library/Logs/DiagnosticReports/ || true
            for f in ~/Library/Logs/DiagnosticReports/*; do
              [ -f "$f" ] || continue
              echo "--- $f ---"
              head -n 60 "$f"
            done
            echo "=== Simulator App System Logs ==="
            xcrun simctl spawn "$IPAD_UDID" log show --predicate 'process == "Maktabah" OR process == "Maktabah-iOSUITests-Runner"' --style syslog --last 5m | tail -n 100 || true
            exit "$TEST_EXIT"
          fi
      - name: Upload Compilation and Test Results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: macos27-simulator-test-results
          path: |
            build/logs/
            build/DerivedData/TestResults.xcresult
          if-no-files-found: warn

  device-build:
    name: Build iphoneos Compile-Only (Release) on Xcode 27
    needs: [otzaria-framework, zayit-framework, swiftpm]
    runs-on: xcode-27
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          pattern: ios-build-*
          path: build/artifacts
          merge-multiple: true

      - name: Restore build inputs
        run: |
          mkdir -p Vendor/ZayitSearchPort/build build build/logs
          tar -C Vendor/OtzariaSearchEngine -xf build/artifacts/OtzariaSearchEngine.xcframework.tar
          tar -C Vendor/ZayitSearchPort/build -xf build/artifacts/MaktabahZayitSearch.xcframework.tar
          tar -C build -xf build/artifacts/SourcePackages.tar
          python3 Scripts/CI/verify-otzaria-xcode-project.py

      - name: Compile Maktabah-iOS for iphoneos (Release)
        run: |
          JOBS="$(sysctl -n hw.ncpu)"
          [ "$JOBS" -le 8 ] || JOBS=8
          set -o pipefail
          xcodebuild build \
            -project "$PROJECT_PATH" \
            -scheme "$SCHEME" \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build/DerivedData-iphoneos \
            -clonedSourcePackagesDirPath build/SourcePackages \
            -disableAutomaticPackageResolution \
            -parallelizeTargets -jobs "$JOBS" -showBuildTimingSummary \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" \
            2>&1 | tee build/logs/build-iphoneos.log
          echo "Release iphoneos compilation successful!"

      - name: Upload Device Compilation Log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: macos27-device-build-logs
          path: build/logs/build-iphoneos.log
          if-no-files-found: warn

  boundary-guard-diagnostic:
    name: Protected hunk approval DIAGNOSTIC (pending owner signature)
    runs-on: xcode-27
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Run Cryptographic Boundary Security Negative Tests
        run: |
          python3 tools/test_upstream_boundary_security.py

      - name: Verify Upstream Boundary Guard
        id: guard
        run: |
          mkdir -p build/reports
          EXIT_CODE=0
          python3 Scripts/CI/verify-upstream-boundary.py \
            --base 031df35710ab2c6015efb1acd1e65154dbcd3f24 \
            --head HEAD \
            --upstream-ref a0ed0df908a6cb38bc459d4baaeb400f447b2fc4 \
            --owner-public-key "${{ vars.MAKTABAH_OWNER_VERIFICATION_KEY || secrets.MAKTABAH_OWNER_VERIFICATION_KEY }}" \
            --report-json build/reports/boundary-guard-report.json || EXIT_CODE=$?

          echo "guard_exit=$EXIT_CODE" >> "$GITHUB_OUTPUT"
          if [ "$EXIT_CODE" -eq 0 ]; then
            echo "### Protected Upstream Boundary: VERIFIED OWNER APPROVED" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "### Protected Upstream Boundary: DIAGNOSTIC ONLY (14 hunks pending owner Ed25519 signature)" >> "$GITHUB_STEP_SUMMARY"
            echo "Release gate remains fail-closed until owner signs exact hunks." >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Upload Boundary Guard Report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: boundary-guard-report
          path: build/reports/boundary-guard-report.json
          if-no-files-found: warn

  production-database-acceptance:
    name: Real Otzaria Production Corpus (1.85 GB) Acceptance
    needs: [otzaria-framework, zayit-framework, swiftpm]
    runs-on: xcode-27
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/download-artifact@v4
        with:
          pattern: ios-build-*
          path: build/artifacts
          merge-multiple: true

      - name: Restore build inputs
        run: |
          mkdir -p Vendor/ZayitSearchPort/build build build/logs build/production-corpus
          tar -C Vendor/OtzariaSearchEngine -xf build/artifacts/OtzariaSearchEngine.xcframework.tar
          tar -C Vendor/ZayitSearchPort/build -xf build/artifacts/MaktabahZayitSearch.xcframework.tar
          tar -C build -xf build/artifacts/SourcePackages.tar
          bash Scripts/CI/verify-xcframework.sh Vendor/OtzariaSearchEngine/OtzariaSearchEngine.xcframework otzaria_search_engine.h
          bash Scripts/CI/verify-xcframework.sh Vendor/ZayitSearchPort/build/MaktabahZayitSearch.xcframework maktabah_zayit_search.h
          python3 Scripts/CI/verify-otzaria-xcode-project.py

      - name: Cache Official Production SQLite Asset
        id: db-cache
        uses: actions/cache@v4
        with:
          path: build/production-corpus/seforim-schema6.db.zst
          key: ${{ runner.os }}-otzaria-production-db-v32-6661911ac0a0d68b8b8bf931fabf7df3934ae0a82fc573d3d5eec999514f0c44

      - name: Download Official Production Seforim Database Asset
        if: steps.db-cache.outputs.cache-hit != 'true'
        run: |
          echo "Downloading official release asset v32-20261010190601 / seforim-schema6.db.zst (1,850,679,582 bytes)..."
          curl -L -f --retry 3 -o build/production-corpus/seforim-schema6.db.zst \
            "https://github.com/Otzaria/SeforimLibrary/releases/download/v32-20261010190601/seforim-schema6.db.zst"

      - name: Verify Official Asset Integrity and Decompress
        run: |
          EXPECTED_SHA="6661911ac0a0d68b8b8bf931fabf7df3934ae0a82fc573d3d5eec999514f0c44"
          ACTUAL_SHA=$(shasum -a 256 build/production-corpus/seforim-schema6.db.zst | cut -d' ' -f1)
          echo "Expected SHA256: $EXPECTED_SHA"
          echo "Actual SHA256:   $ACTUAL_SHA"
          if [ "$ACTUAL_SHA" != "$EXPECTED_SHA" ]; then
            echo "::error::Asset SHA256 digest mismatch!"
            exit 1
          fi
          ACTUAL_SIZE=$(stat -f%z build/production-corpus/seforim-schema6.db.zst)
          echo "Compressed byte length: $ACTUAL_SIZE (expected: 1850679582)"
          if [ "$ACTUAL_SIZE" -ne 1850679582 ]; then
            echo "::error::Asset byte length mismatch!"
            exit 1
          fi
          echo "Decompressing with zstd..."
          zstd -T0 -d build/production-corpus/seforim-schema6.db.zst -o build/production-corpus/seforim.db
          echo "SQLite Integrity Quick Check..."
          sqlite3 build/production-corpus/seforim.db "PRAGMA quick_check;"
          sqlite3 build/production-corpus/seforim.db "SELECT count(*) FROM book;"
          sqlite3 build/production-corpus/seforim.db "SELECT count(*) FROM category;"

      - name: Build Maktabah-iOS with Production Profile for Simulator Testing
        run: |
          JOBS="$(sysctl -n hw.ncpu)"
          [ "$JOBS" -le 8 ] || JOBS=8
          set -o pipefail
          xcodebuild build-for-testing \
            -project "$PROJECT_PATH" \
            -scheme "$SCHEME" \
            -configuration Debug \
            -sdk iphonesimulator \
            -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath build/DerivedData-prod \
            -clonedSourcePackagesDirPath build/SourcePackages \
            -disableAutomaticPackageResolution \
            OTZARIA_DEFAULT_DATA_PROFILE=production \
            -parallelizeTargets -jobs "$JOBS" -showBuildTimingSummary \
            CODE_SIGN_IDENTITY="-" CODE_SIGNING_REQUIRED=YES CODE_SIGNING_ALLOWED=YES \
            2>&1 | tee build/logs/build-simulator-prod.log

          APP="build/DerivedData-prod/Build/Products/Debug-iphonesimulator/${PRODUCT_NAME}.app"
          /usr/libexec/PlistBuddy -c 'Set :OtzariaDefaultDataProfile production' "$APP/Info.plist" 2>/dev/null || /usr/libexec/PlistBuddy -c 'Add :OtzariaDefaultDataProfile string production' "$APP/Info.plist"
          codesign --force --deep --sign - "$APP"
          RUNNER="build/DerivedData-prod/Build/Products/Debug-iphonesimulator/Maktabah-iOSUITests-Runner.app"
          if [ -d "$RUNNER" ]; then
            codesign --force --deep --sign - "$RUNNER"
          fi

      - name: Provision Production Database and Run Production Acceptance Tests
        run: |
          set -o pipefail
          IPAD_UDID=$(xcrun simctl list devices available -j | python3 -c "import json, sys; devs = [d for r, dl in json.load(sys.stdin).get('devices', {}).items() if 'iOS' in r for d in dl if d.get('isAvailable') and 'iPad' in d.get('name', '')]; print(next((d['udid'] for d in devs if 'iPad Pro 13-inch' in d['name']), next((d['udid'] for d in devs if 'iPad Pro' in d['name']), devs[0]['udid'])))")
          echo "Selected iPad Simulator UDID: $IPAD_UDID"
          xcrun simctl boot "$IPAD_UDID" || true
          xcrun simctl bootstatus "$IPAD_UDID" -b

          APP="build/DerivedData-prod/Build/Products/Debug-iphonesimulator/${PRODUCT_NAME}.app"
          xcrun simctl install "$IPAD_UDID" "$APP"

          CONTAINER_DIR=$(xcrun simctl get_app_container "$IPAD_UDID" "group.com.davidpovarsky.chavrusatext" data 2>/dev/null || true)
          if [ -n "$CONTAINER_DIR" ] && [ -d "$CONTAINER_DIR" ]; then
            echo "Found App Group Container at: $CONTAINER_DIR"
            TARGET_DB_DIR="$CONTAINER_DIR/Library/Application Support/Otzaria/DataProfiles/production/Database"
            mkdir -p "$TARGET_DB_DIR"
            cp build/production-corpus/seforim.db "$TARGET_DB_DIR/seforim.db"
            echo "Installed production seforim.db into App Group Container."
          fi

          xcodebuild test-without-building \
            -project "$PROJECT_PATH" \
            -scheme "$SCHEME" \
            -configuration Debug \
            -destination "platform=iOS Simulator,id=$IPAD_UDID" \
            -derivedDataPath build/DerivedData-prod \
            -only-testing:Maktabah-iOSUITests/ProductionOtzariaAcceptanceTests \
            -only-testing:Maktabah-iOSUITests/BackendTransitionAcceptanceTests \
            -resultBundlePath build/DerivedData-prod/ProductionTestResults.xcresult \
            2>&1 | tee build/logs/test-simulator-prod.log

      - name: Upload Production Acceptance Test Results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: macos27-production-acceptance-results
          path: |
            build/logs/
            build/DerivedData-prod/ProductionTestResults.xcresult
          if-no-files-found: warn
