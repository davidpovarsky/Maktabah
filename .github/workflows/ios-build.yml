name: iOS Build

on:
  workflow_dispatch:
    inputs:
      run_heavy_otzaria_acceptance:
        description: Run the real production Swift download, resume, extraction and activation acceptance
        required: false
        default: false
        type: boolean
      run_corpus_acceptance:
        description: Reindex the native-downloaded corpus (only when indexing semantics changed)
        required: false
        default: false
        type: boolean
      run_live_sefaria_smoke:
        description: Run live Sefaria API and real smallest-package contract smoke
        required: false
        default: false
        type: boolean

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}-${{ inputs.run_heavy_otzaria_acceptance && 'heavy' || 'normal' }}
  cancel-in-progress: false

permissions:
  contents: read

env:
  PROJECT_PATH: Maktabah.xcodeproj
  SCHEME: Maktabah-iOS
  PRODUCT_NAME: Maktabah
  CARGO_TERM_COLOR: always

jobs:
  otzaria-framework:
    name: Build or restore Otzaria framework
    runs-on: macos-26
    timeout-minutes: 90
    outputs:
      framework-cache-hit: ${{ steps.framework-valid.outputs.valid }}
      cargo-registry-hit: ${{ steps.cargo-registry.outputs.cache-hit }}
      rebuilt: ${{ steps.framework-valid.outputs.valid != 'true' }}
    steps:
      - uses: actions/checkout@v4
      - name: Select Xcode 26
        id: xcode
        run: |
          bash Scripts/CI/select-xcode-26.sh
          echo "id=$(xcodebuild -version | shasum -a 256 | cut -d' ' -f1)" >> "$GITHUB_OUTPUT"
      - uses: dtolnay/rust-toolchain@stable
      - name: Identify Rust toolchain
        id: rustc
        run: echo "id=$(rustc -Vv | shasum -a 256 | cut -d' ' -f1)" >> "$GITHUB_OUTPUT"
      - name: Cache Cargo registry
        id: cargo-registry
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: ${{ runner.os }}-${{ runner.arch }}-cargo-registry-v2-${{ hashFiles('Vendor/OtzariaSearchEngine/ios_bridge/Cargo.lock') }}
      - name: Cache production Otzaria framework
        uses: actions/cache@v4
        with:
          path: |
            Vendor/OtzariaSearchEngine/OtzariaSearchEngine.xcframework
            Vendor/OtzariaSearchEngine/ios_bridge/target
          key: ${{ runner.os }}-${{ runner.arch }}-xcode-${{ steps.xcode.outputs.id }}-otzaria-framework-v3-${{ steps.rustc.outputs.id }}-${{ hashFiles('Vendor/OtzariaSearchEngine/Upstream/**', 'Vendor/OtzariaSearchEngine/Resources/**', 'Vendor/OtzariaSearchEngine/build_xcframework.sh', 'Vendor/OtzariaSearchEngine/ios_bridge/Cargo.toml', 'Vendor/OtzariaSearchEngine/ios_bridge/Cargo.lock', 'Vendor/OtzariaSearchEngine/ios_bridge/build.rs', 'Vendor/OtzariaSearchEngine/ios_bridge/src/**', 'Vendor/OtzariaSearchEngine/include/**', 'Vendor/OtzariaSearchEngine/module.modulemap') }}
      - name: Validate restored Otzaria framework
        id: framework-valid
        run: |
          if bash Scripts/CI/verify-xcframework.sh Vendor/OtzariaSearchEngine/OtzariaSearchEngine.xcframework otzaria_search_engine.h; then
            echo "valid=true" >> "$GITHUB_OUTPUT"
          else
            rm -rf Vendor/OtzariaSearchEngine/OtzariaSearchEngine.xcframework Vendor/OtzariaSearchEngine/ios_bridge/target
            echo "valid=false" >> "$GITHUB_OUTPUT"
          fi
      # The framework cache stores build products only. The Cargo graph resolves
      # path dependencies into the upstream checkout, so it must be materialized
      # from the pin even when the cache hit skips the XCFramework build.
      - name: Materialize pinned Otzaria upstream checkout
        run: bash Scripts/CI/ensure-otzaria-upstream-checkout.sh
      - name: Build Otzaria production semantic XCFramework
        if: steps.framework-valid.outputs.valid != 'true'
        run: bash Vendor/OtzariaSearchEngine/build_xcframework.sh
      - name: Verify Otzaria framework and semantic host build
        run: |
          bash Scripts/CI/verify-xcframework.sh Vendor/OtzariaSearchEngine/OtzariaSearchEngine.xcframework otzaria_search_engine.h
          cargo check --locked --features semantic --manifest-path Vendor/OtzariaSearchEngine/ios_bridge/Cargo.toml
      - name: Package Otzaria framework
        run: |
          mkdir -p build/artifacts
          tar -C Vendor/OtzariaSearchEngine -cf build/artifacts/OtzariaSearchEngine.xcframework.tar OtzariaSearchEngine.xcframework
      - uses: actions/upload-artifact@v4
        with:
          name: ios-build-otzaria-xcframework
          path: build/artifacts/OtzariaSearchEngine.xcframework.tar
          compression-level: 0
          if-no-files-found: error
      - name: Confirm exact pinned and pristine upstream checkout
        if: always()
        run: bash Scripts/CI/ensure-otzaria-upstream-checkout.sh --verify-only

  zayit-framework:
    name: Build or restore Zayit framework
    runs-on: macos-26
    timeout-minutes: 60
    outputs:
      framework-cache-hit: ${{ steps.framework-valid.outputs.valid }}
      cargo-registry-hit: ${{ steps.cargo-registry.outputs.cache-hit }}
      rebuilt: ${{ steps.framework-valid.outputs.valid != 'true' }}
    steps:
      - uses: actions/checkout@v4
      - name: Select Xcode 26
        id: xcode
        run: |
          bash Scripts/CI/select-xcode-26.sh
          echo "id=$(xcodebuild -version | shasum -a 256 | cut -d' ' -f1)" >> "$GITHUB_OUTPUT"
      - uses: dtolnay/rust-toolchain@stable
      - name: Identify Rust toolchain
        id: rustc
        run: echo "id=$(rustc -Vv | shasum -a 256 | cut -d' ' -f1)" >> "$GITHUB_OUTPUT"
      - name: Cache Cargo registry
        id: cargo-registry
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: ${{ runner.os }}-${{ runner.arch }}-cargo-registry-v2-${{ hashFiles('Vendor/ZayitSearchPort/Rust/Cargo.lock') }}
      - name: Cache Zayit framework
        uses: actions/cache@v4
        with:
          path: |
            Vendor/ZayitSearchPort/build/MaktabahZayitSearch.xcframework
            Vendor/ZayitSearchPort/Rust/target
          key: ${{ runner.os }}-${{ runner.arch }}-xcode-${{ steps.xcode.outputs.id }}-zayit-framework-v3-${{ steps.rustc.outputs.id }}-${{ hashFiles('Vendor/ZayitSearchPort/Rust/Cargo.toml', 'Vendor/ZayitSearchPort/Rust/Cargo.lock', 'Vendor/ZayitSearchPort/Rust/src/**', 'Vendor/ZayitSearchPort/Rust/include/**', 'Vendor/ZayitSearchPort/Scripts/build-ios-xcframework.sh') }}
      - name: Validate restored Zayit framework
        id: framework-valid
        run: |
          if bash Scripts/CI/verify-xcframework.sh Vendor/ZayitSearchPort/build/MaktabahZayitSearch.xcframework maktabah_zayit_search.h; then
            echo "valid=true" >> "$GITHUB_OUTPUT"
          else
            rm -rf Vendor/ZayitSearchPort/build/MaktabahZayitSearch.xcframework Vendor/ZayitSearchPort/Rust/target
            echo "valid=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Build Zayit XCFramework
        if: steps.framework-valid.outputs.valid != 'true'
        run: bash Vendor/ZayitSearchPort/Scripts/build-ios-xcframework.sh
      - name: Verify Zayit framework
        run: bash Scripts/CI/verify-xcframework.sh Vendor/ZayitSearchPort/build/MaktabahZayitSearch.xcframework maktabah_zayit_search.h
      - name: Package Zayit framework
        run: |
          mkdir -p build/artifacts
          tar -C Vendor/ZayitSearchPort/build -cf build/artifacts/MaktabahZayitSearch.xcframework.tar MaktabahZayitSearch.xcframework
      - uses: actions/upload-artifact@v4
        with:
          name: ios-build-zayit-xcframework
          path: build/artifacts/MaktabahZayitSearch.xcframework.tar
          compression-level: 0
          if-no-files-found: error

  swiftpm:
    name: Resolve Swift packages once
    runs-on: macos-26
    timeout-minutes: 30
    outputs:
      cache-hit: ${{ steps.swiftpm-cache.outputs.cache-hit }}
    steps:
      - uses: actions/checkout@v4
      - name: Select Xcode 26 and identify package graph
        id: cache-inputs
        run: |
          bash Scripts/CI/select-xcode-26.sh
          echo "xcode=$(xcodebuild -version | shasum -a 256 | cut -d' ' -f1)" >> "$GITHUB_OUTPUT"
          echo "swiftpm=$(python3 Scripts/CI/cache-key-inputs.py swiftpm)" >> "$GITHUB_OUTPUT"
      - name: Cache Swift package dependencies
        id: swiftpm-cache
        uses: actions/cache@v4
        with:
          path: |
            ~/Library/Caches/org.swift.swiftpm
            ~/Library/org.swift.swiftpm
            build/SourcePackages
          key: ${{ runner.os }}-${{ runner.arch }}-swiftpm-v3-${{ steps.cache-inputs.outputs.xcode }}-${{ steps.cache-inputs.outputs.swiftpm }}
      - name: Resolve package dependencies
        run: |
          xcodebuild -resolvePackageDependencies \
            -project "$PROJECT_PATH" \
            -scheme "$SCHEME" \
            -clonedSourcePackagesDirPath build/SourcePackages
      - name: Package resolved sources
        run: |
          mkdir -p build/artifacts
          tar -C build -cf build/artifacts/SourcePackages.tar SourcePackages
      - uses: actions/upload-artifact@v4
        with:
          name: ios-build-swift-packages
          path: build/artifacts/SourcePackages.tar
          compression-level: 0
          if-no-files-found: error

  simulator-build:
    name: Build simulator app
    needs: [otzaria-framework, zayit-framework, swiftpm]
    runs-on: macos-26
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v4
      - name: Select Xcode 26
        run: bash Scripts/CI/select-xcode-26.sh
      - uses: actions/download-artifact@v4
        with:
          pattern: ios-build-*
          path: build/artifacts
          merge-multiple: true
      - name: Restore build inputs
        run: |
          mkdir -p Vendor/ZayitSearchPort/build build
          tar -C Vendor/OtzariaSearchEngine -xf build/artifacts/OtzariaSearchEngine.xcframework.tar
          tar -C Vendor/ZayitSearchPort/build -xf build/artifacts/MaktabahZayitSearch.xcframework.tar
          tar -C build -xf build/artifacts/SourcePackages.tar
          bash Scripts/CI/verify-xcframework.sh Vendor/OtzariaSearchEngine/OtzariaSearchEngine.xcframework otzaria_search_engine.h
          bash Scripts/CI/verify-xcframework.sh Vendor/ZayitSearchPort/build/MaktabahZayitSearch.xcframework maktabah_zayit_search.h
          python3 Scripts/CI/verify-otzaria-xcode-project.py
      - name: Test Inspector backend mappings
        run: |
          xcrun swiftc -D OTZARIA_INSPECTOR_MAPPING_TESTS \
            Source/LibraryBackend/LibraryBackendModels.swift \
            Source/LibraryBackend/LibraryBackendProtocols.swift \
            Source/LibraryBackend/BackendCoordinator.swift \
            Source/LibraryBackend/LegacyIdentityRegistry.swift \
            Source/Sefaria/Domain/SefariaModels.swift \
            Source/Sefaria/Domain/SefariaNavigationParser.swift \
            Source/Sefaria/Network/SefariaDTOs.swift \
            Source/Sefaria/Offline/SefariaExportModels.swift \
            Source/Sefaria/Downloads/SefariaPackagePolicy.swift \
            Source/Otzaria/Core/String+OtzariaText.swift \
            Source/Otzaria/Domain/OtzariaModels.swift \
            Source/Otzaria/Reading/OtzariaLineAnchor.swift \
            Source/Otzaria/Reading/OtzariaReadingUnit.swift \
            Source/Otzaria/Reading/OtzariaInspectorRelationshipsProvider.swift \
            Vendor/SefariaNativeTests/TestSupport.swift \
            Vendor/SefariaNativeTests/LocatorAndRefTests.swift \
            Vendor/SefariaNativeTests/DecodingTests.swift \
            Vendor/SefariaNativeTests/NavigationAndPackageTests.swift \
            Vendor/SefariaNativeTests/LegacyIdentityRegistryTests.swift \
            Vendor/SefariaNativeTests/BackendCoordinatorTests.swift \
            Vendor/SefariaNativeTests/SefariaNativeTestMain.swift \
            -o "$RUNNER_TEMP/inspector-backend-tests"
          "$RUNNER_TEMP/inspector-backend-tests"
      - name: Run live Sefaria contracts and real package smoke
        if: ${{ inputs.run_live_sefaria_smoke }}
        continue-on-error: true
        run: bash Scripts/run-sefaria-native-smoke.sh
      - name: Build simulator app without signing
        run: |
          mkdir -p build/logs
          JOBS="$(sysctl -n hw.ncpu)"
          [ "$JOBS" -le 8 ] || JOBS=8
          set -o pipefail
          xcodebuild build \
            -project "$PROJECT_PATH" \
            -scheme "$SCHEME" \
            -configuration Debug \
            -sdk iphonesimulator \
            -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath build/DerivedData \
            -clonedSourcePackagesDirPath build/SourcePackages \
            -disableAutomaticPackageResolution \
            -parallelizeTargets -jobs "$JOBS" -showBuildTimingSummary \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" \
            2>&1 | tee build/logs/build-simulator.log
          APP="build/DerivedData/Build/Products/Debug-iphonesimulator/${PRODUCT_NAME}.app"
          test -d "$APP"
          test -f "$APP/dictionary.json"
          test -f "$APP/Acronyms.json"
          tar -C "$(dirname "$APP")" -cf build/artifacts/Maktabah-simulator-app.tar "$(basename "$APP")"
      - name: Capture iPad bootstrap localization smoke screenshots
        run: |
          APP="build/DerivedData/Build/Products/Debug-iphonesimulator/${PRODUCT_NAME}.app"
          BUNDLE_ID="$(/usr/libexec/PlistBuddy -c 'Print :CFBundleIdentifier' "$APP/Info.plist")"
          DEVICE_TYPE="$(xcrun simctl list devicetypes -j | python3 -c 'import json,sys; values=json.load(sys.stdin)["devicetypes"]; print(next(item["identifier"] for item in values if "iPad Pro" in item["name"] and "13-inch" in item["name"]))')"
          RUNTIME="$(xcrun simctl list runtimes -j | python3 -c 'import json,sys; values=[item for item in json.load(sys.stdin)["runtimes"] if item.get("isAvailable") and item["identifier"].startswith("com.apple.CoreSimulator.SimRuntime.iOS")]; print(values[-1]["identifier"])')"
          UDID="$(xcrun simctl create 'Maktabah Bootstrap iPad' "$DEVICE_TYPE" "$RUNTIME")"
          trap 'xcrun simctl shutdown "$UDID" >/dev/null 2>&1 || true; xcrun simctl delete "$UDID" >/dev/null 2>&1 || true' EXIT
          xcrun simctl boot "$UDID"
          xcrun simctl bootstatus "$UDID" -b
          mkdir -p build/ipad-bootstrap-screenshots

          capture_screen() {
            local language="$1"
            local locale="$2"
            local state="$3"
            local output="$4"
            xcrun simctl uninstall "$UDID" "$BUNDLE_ID" >/dev/null 2>&1 || true
            xcrun simctl install "$UDID" "$APP"
            if [ "$state" = "error" ]; then
              xcrun simctl launch "$UDID" "$BUNDLE_ID" -AppleLanguages "($language)" -AppleLocale "$locale" -bootstrapInsufficientSpacePreview
            else
              xcrun simctl launch "$UDID" "$BUNDLE_ID" -AppleLanguages "($language)" -AppleLocale "$locale"
            fi
            sleep 3
            xcrun simctl io "$UDID" screenshot "build/ipad-bootstrap-screenshots/$output"
            xcrun simctl terminate "$UDID" "$BUNDLE_ID" || true
          }

          capture_screen en en_US source source-en.png
          capture_screen he he_IL source source-he.png
          capture_screen en en_US error error-en.png
          capture_screen he he_IL error error-he.png
          test "$(find build/ipad-bootstrap-screenshots -name '*.png' -size +10k | wc -l | tr -d ' ')" = 4
      - uses: actions/upload-artifact@v4
        with:
          name: iPad-bootstrap-localization-screenshots
          path: build/ipad-bootstrap-screenshots
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        with:
          name: Maktabah-iOS-simulator-app
          path: build/artifacts/Maktabah-simulator-app.tar
          compression-level: 0
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: simulator-build-logs
          path: build/logs
          compression-level: 0
          if-no-files-found: warn

  device-build:
    name: Build unsigned device IPA
    needs: [otzaria-framework, zayit-framework, swiftpm]
    runs-on: macos-26
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v4
      - name: Select Xcode 26
        run: bash Scripts/CI/select-xcode-26.sh
      - uses: actions/download-artifact@v4
        with:
          pattern: ios-build-*
          path: build/artifacts
          merge-multiple: true
      - name: Restore build inputs
        run: |
          mkdir -p Vendor/ZayitSearchPort/build build
          tar -C Vendor/OtzariaSearchEngine -xf build/artifacts/OtzariaSearchEngine.xcframework.tar
          tar -C Vendor/ZayitSearchPort/build -xf build/artifacts/MaktabahZayitSearch.xcframework.tar
          tar -C build -xf build/artifacts/SourcePackages.tar
          python3 Scripts/CI/verify-otzaria-xcode-project.py
      - name: Build unsigned device IPA for inspection
        run: |
          mkdir -p build/logs
          JOBS="$(sysctl -n hw.ncpu)"
          [ "$JOBS" -le 8 ] || JOBS=8
          set -o pipefail
          xcodebuild build \
            -project "$PROJECT_PATH" \
            -scheme "$SCHEME" \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build/DerivedData-iphoneos \
            -clonedSourcePackagesDirPath build/SourcePackages \
            -disableAutomaticPackageResolution \
            -parallelizeTargets -jobs "$JOBS" -showBuildTimingSummary \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" \
            2>&1 | tee build/logs/build-unsigned-device.log
          APP="build/DerivedData-iphoneos/Build/Products/Release-iphoneos/${PRODUCT_NAME}.app"
          test -d "$APP"
          rm -rf Payload "${PRODUCT_NAME}-unsigned.ipa"
          mkdir -p Payload
          cp -R "$APP" Payload/
          /usr/bin/zip -qry "${PRODUCT_NAME}-unsigned.ipa" Payload
          if unzip -l "${PRODUCT_NAME}-unsigned.ipa" | grep -E '(^|/)(seforim\.db|lexical\.db)( |$)|zayit-search-index'; then
            echo "::error::Unsigned IPA contains runtime search data"
            exit 1
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: Maktabah-iOS-unsigned-ipa-not-installable
          path: Maktabah-unsigned.ipa
          compression-level: 0
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: device-build-logs
          path: build/logs
          compression-level: 0
          if-no-files-found: warn

  native-bootstrap-heavy:
    name: Real native Otzaria bootstrap acceptance
    if: ${{ inputs.run_heavy_otzaria_acceptance == true }}
    needs: simulator-build
    runs-on: macos-26
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@v4
      - name: Select Xcode 26
        run: bash Scripts/CI/select-xcode-26.sh
      - uses: actions/download-artifact@v4
        with:
          name: Maktabah-iOS-simulator-app
          path: build/artifacts
      - name: Restore simulator app and check disk
        run: |
          mkdir -p build/SimulatorApp build/logs
          tar -C build/SimulatorApp -xf build/artifacts/Maktabah-simulator-app.tar
          test -d build/SimulatorApp/Maktabah.app
          df -h "$RUNNER_TEMP" "$GITHUB_WORKSPACE"
          AVAILABLE_KIB="$(df -Pk "$RUNNER_TEMP" | awk 'NR==2 {print $4}')"
          test "$AVAILABLE_KIB" -ge $((22 * 1024 * 1024))
      - name: Run real native Otzaria bootstrap acceptance
        env:
          OTZARIA_NATIVE_BOOTSTRAP_REPORT_DIR: ${{ github.workspace }}/build/logs
        run: bash Scripts/run-otzaria-native-bootstrap-acceptance.sh "$GITHUB_WORKSPACE/build/SimulatorApp/Maktabah.app"
      - name: Compare production-selected release with GitHub metadata
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh api repos/Otzaria/SeforimLibrary/releases/latest > build/logs/otzaria-latest-release.json
          python3 - <<'PY'
          import json
          report = json.load(open("build/logs/otzaria-native-bootstrap-acceptance.json"))
          release = json.load(open("build/logs/otzaria-latest-release.json"))
          assets = [asset for asset in release["assets"] if asset["name"] == "seforim.db.zst"]
          assert len(assets) == 1
          asset = assets[0]
          assert report["releaseID"] == release["id"]
          assert report["releaseTag"] == release["tag_name"]
          assert report["assetID"] == asset["id"]
          assert report["expectedCompressedBytes"] == asset["size"]
          assert report.get("expectedSHA256") == (asset.get("digest") or "").removeprefix("sha256:")
          PY
      - name: Run optional corpus acceptance using the native-downloaded database
        if: ${{ inputs.run_corpus_acceptance == true }}
        env:
          OTZARIA_CORPUS_ACCEPTANCE_SKIP_BUILD: "1"
          OTZARIA_CORPUS_ACCEPTANCE_APP_PATH: ${{ github.workspace }}/build/SimulatorApp/Maktabah.app
          OTZARIA_CORPUS_ACCEPTANCE_REPORT_COPY: ${{ github.workspace }}/build/logs/otzaria-corpus-acceptance.json
        run: |
          DATABASE="$(sed -n 's/^database_path=//p' build/logs/otzaria-native-database-path.txt)"
          test -f "$DATABASE"
          bash Scripts/run-otzaria-corpus-acceptance.sh "$DATABASE"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: otzaria-native-bootstrap-acceptance
          path: build/logs
          compression-level: 0
          if-no-files-found: error

  build-summary:
    name: Build and cache summary
    if: always()
    needs:
      - otzaria-framework
      - zayit-framework
      - swiftpm
      - simulator-build
      - device-build
      - native-bootstrap-heavy
    runs-on: ubuntu-latest
    steps:
      - name: Publish build summary
        run: |
          {
            echo "### iOS build cache summary"
            echo "- Otzaria framework cache: ${{ needs.otzaria-framework.outputs.framework-cache-hit == 'true' && 'HIT' || 'MISS' }}"
            echo "- Otzaria rebuilt: ${{ needs.otzaria-framework.outputs.rebuilt }}"
            echo "- Zayit cache: ${{ needs.zayit-framework.outputs.framework-cache-hit == 'true' && 'HIT' || 'MISS' }}"
            echo "- Zayit rebuilt: ${{ needs.zayit-framework.outputs.rebuilt }}"
            echo "- SwiftPM cache: ${{ needs.swiftpm.outputs.cache-hit == 'true' && 'HIT' || 'MISS' }}"
            echo "- Cargo registry cache (Otzaria): ${{ needs.otzaria-framework.outputs.cargo-registry-hit == 'true' && 'HIT' || 'MISS' }}"
            echo "- Cargo registry cache (Zayit): ${{ needs.zayit-framework.outputs.cargo-registry-hit == 'true' && 'HIT' || 'MISS' }}"
            echo "- Ruby cache: NOT USED"
          } | tee -a "$GITHUB_STEP_SUMMARY"
          test "${{ needs.otzaria-framework.result }}" = success
          test "${{ needs.zayit-framework.result }}" = success
          test "${{ needs.swiftpm.result }}" = success
          test "${{ needs.simulator-build.result }}" = success
          test "${{ needs.device-build.result }}" = success
          if [ "${{ inputs.run_heavy_otzaria_acceptance }}" = true ]; then
            test "${{ needs.native-bootstrap-heavy.result }}" = success
          fi
