name: Owned annotation CloudKit component 48, original local 43 and exchange 28

on:
  push:
    branches:
      - codex/otzaria-local-annotation-cloud-apple-reviewed-20261120

permissions:
  actions: read
  contents: read

concurrency:
  group: local-annotation-apple-${{ github.ref }}
  cancel-in-progress: false

jobs:
  original-annotation-components:
    if: ${{ github.event_name == 'push' && github.repository == 'davidpovarsky/Maktabah' && github.ref == 'refs/heads/codex/otzaria-local-annotation-cloud-apple-reviewed-20261120' }}
    runs-on: xcode-27
    timeout-minutes: 60
    env:
      EXPECTED_CHECKOUT_SHA: ${{ github.sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
          submodules: false
          persist-credentials: false
      - name: Bind complete exact source before execution
        id: source
        timeout-minutes: 3
        run: |
          python3 - <<'PYBOOT'
          import hashlib, json, pathlib
          root = pathlib.Path.cwd()
          output = root / 'build/local-annotation-cloud-route'
          output.mkdir(parents=True, exist_ok=True)
          expected = {'Scripts/CI/local-annotation-cloud-apple.py': 'f39979e99c8d3172bc105b17ff0f6e373b65e9de9f2dd34efffce83f933f5fd6', 'Scripts/CI/local-annotation-cloud-apple.inputs.json': '85cf4b4309b247a0f763020a0695086d3b6463d09c66c00436f1a7b1b55e73a3', 'Scripts/CI/test-local-annotation-cloud-apple.py': '1b2a21f84ae9690b283844b3907608b8338a9e3c067f941f36fd356d532ad059', 'Scripts/CI/select-runtime27-toolchain.py': '92b748b10a32e8d40ff97190bb3b0ba4c199c5e688d8897084406b1bbad43dd8'}
          report = {'status': 'FAILED', 'scope': 'Bootstrap source only; zero Swift/Native execution', 'pins': expected}
          try:
              for relative, digest in expected.items():
                  actual = hashlib.sha256((root / relative).read_bytes()).hexdigest()
                  if actual != digest:
                      raise ValueError('Reviewed CI input differs: ' + relative)
              report['status'] = 'BOOTSTRAP_SOURCE_BOUND'
          except Exception as error:
              report['error'] = repr(error)
              raise
          finally:
              (output / 'bootstrap.json').write_text(json.dumps(report, sort_keys=True, indent=2) + '\n', encoding='utf-8')
          PYBOOT
          python3 Scripts/CI/local-annotation-cloud-apple.py --phase before
      - name: Select the unchanged installed Apple toolchain
        id: toolchain
        timeout-minutes: 8
        run: python3 Scripts/CI/select-runtime27-toolchain.py --github-env --report build/local-annotation-cloud-route/toolchain.json
      - name: Check strict source and result rejection controls
        id: controls
        timeout-minutes: 3
        run: |
          set -o pipefail
          python3 Scripts/CI/test-local-annotation-cloud-apple.py --artifacts-dir build/local-annotation-cloud-route/python-controls 2>&1 | tee build/local-annotation-cloud-route/python-controls.log
          python3 tools/test-local-cloud-pending-sql.py --root . --output build/local-annotation-cloud-route/sql-premises/RESULT.json
      - name: Execute owned cloud 48, unchanged local 43 and two separate-process cold reopens
        id: local
        if: ${{ steps.source.outcome == 'success' && steps.toolchain.outcome == 'success' && steps.controls.outcome == 'success' }}
        continue-on-error: true
        timeout-minutes: 20
        run: python3 tools/hq-local-annotation-cloud-acceptance.py --artifacts-dir build/local-annotation-cloud-acceptance
      - name: Execute unchanged original exchange 28 and two process-termination reopens
        id: exchange
        if: ${{ always() && steps.source.outcome == 'success' && steps.toolchain.outcome == 'success' && steps.controls.outcome == 'success' }}
        continue-on-error: true
        timeout-minutes: 14
        run: python3 tools/hq-annotation-exchange-acceptance.py --artifacts-dir build/local-annotation-cloud-exchange-regression
      - name: Require complete raw results and unchanged original sources
        if: always()
        timeout-minutes: 3
        env:
          LOCAL_CLOUD_TOOLCHAIN_OUTCOME: ${{ steps.toolchain.outcome }}
          LOCAL_CLOUD_CONTROLS_OUTCOME: ${{ steps.controls.outcome }}
          LOCAL_CLOUD_LOCAL_OUTCOME: ${{ steps.local.outcome }}
          LOCAL_CLOUD_EXCHANGE_OUTCOME: ${{ steps.exchange.outcome }}
        run: python3 Scripts/CI/local-annotation-cloud-apple.py --phase after
      - name: Preserve original source, logs, and owned fixture evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: local-annotation-cloud48-local43-cold2-exchange28-crash2
          path: |
            build/local-annotation-cloud-route/**
            build/local-annotation-cloud-acceptance/*.json
            build/local-annotation-cloud-acceptance/*.log
            build/local-annotation-cloud-acceptance/owned-*/fixtures/**
            build/local-annotation-cloud-acceptance/owned-*/cloud-fixtures/**
            build/local-annotation-cloud-acceptance/owned-*/package/Package.swift
            build/local-annotation-cloud-acceptance/owned-*/package/Sources/**
            build/local-annotation-cloud-exchange-regression/*.json
            build/local-annotation-cloud-exchange-regression/*.log
            build/local-annotation-cloud-exchange-regression/owned-*/fixtures/**
            build/local-annotation-cloud-exchange-regression/owned-*/package/Package.swift
            build/local-annotation-cloud-exchange-regression/owned-*/package/Sources/**
          if-no-files-found: error
          retention-days: 30
