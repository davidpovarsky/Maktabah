name: Local annotation Apple Foundation 43 and original exchange 28

on:
  push:
    branches:
      - codex/otzaria-local-annotation-editor-apple-reviewed-20261120

permissions:
  actions: read
  contents: read

concurrency:
  group: local-annotation-apple-${{ github.ref }}
  cancel-in-progress: false

jobs:
  original-annotation-components:
    if: ${{ github.event_name == 'push' && github.repository == 'davidpovarsky/Maktabah' && github.ref == 'refs/heads/codex/otzaria-local-annotation-editor-apple-reviewed-20261120' }}
    runs-on: xcode-27
    timeout-minutes: 50
    env:
      EXPECTED_CHECKOUT_SHA: ${{ github.sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
          submodules: false
          persist-credentials: false
      - name: Bind complete exact source before execution
        id: source
        timeout-minutes: 3
        run: |
          python3 - <<'PYBOOT'
          import hashlib, json, pathlib
          root = pathlib.Path.cwd()
          output = root / 'build/local-annotation-editor-route'
          output.mkdir(parents=True, exist_ok=True)
          expected = {'Scripts/CI/local-annotation-editor-apple.py': '0b7ba240419f11748be34a5a7fa24476605628aa0329c73f0fc4e5955b953715', 'Scripts/CI/local-annotation-editor-apple.inputs.json': 'd39ef384cdc9ec2cfd6d7340c54f23b2728b7c3e6d1775352254cdd0578fd3f7', 'Scripts/CI/test-local-annotation-editor-apple.py': 'e1b99705c513efc6e5a1aad2118eada4d0761a4acaf0ee8c7c35384d86e5268a', 'Scripts/CI/select-runtime27-toolchain.py': '92b748b10a32e8d40ff97190bb3b0ba4c199c5e688d8897084406b1bbad43dd8'}
          report = {'status': 'FAILED', 'scope': 'Bootstrap source only; zero Swift/Native execution', 'pins': expected}
          try:
              for relative, digest in expected.items():
                  actual = hashlib.sha256((root / relative).read_bytes()).hexdigest()
                  if actual != digest:
                      raise ValueError('Reviewed CI input differs: ' + relative)
              report['status'] = 'BOOTSTRAP_SOURCE_BOUND'
          except Exception as error:
              report['error'] = repr(error)
              raise
          finally:
              (output / 'bootstrap.json').write_text(json.dumps(report, sort_keys=True, indent=2) + '\n', encoding='utf-8')
          PYBOOT
          python3 Scripts/CI/local-annotation-editor-apple.py --phase before
      - name: Select the unchanged installed Apple toolchain
        id: toolchain
        timeout-minutes: 8
        run: python3 Scripts/CI/select-runtime27-toolchain.py --github-env --report build/local-annotation-editor-route/toolchain.json
      - name: Check strict source and result rejection controls
        id: controls
        timeout-minutes: 3
        run: |
          set -o pipefail
          python3 Scripts/CI/test-local-annotation-editor-apple.py --artifacts-dir build/local-annotation-editor-route/python-controls 2>&1 | tee build/local-annotation-editor-route/python-controls.log
      - name: Execute local component 43 and two separate-process cold reopens
        id: local
        if: ${{ steps.source.outcome == 'success' && steps.toolchain.outcome == 'success' && steps.controls.outcome == 'success' }}
        continue-on-error: true
        timeout-minutes: 16
        run: python3 tools/hq-local-annotation-editor-acceptance.py --artifacts-dir build/local-annotation-editor-acceptance
      - name: Execute unchanged original exchange 28 and two process-termination reopens
        id: exchange
        if: ${{ always() && steps.source.outcome == 'success' && steps.toolchain.outcome == 'success' && steps.controls.outcome == 'success' }}
        continue-on-error: true
        timeout-minutes: 14
        run: python3 tools/hq-annotation-exchange-acceptance.py --artifacts-dir build/local-annotation-editor-exchange-regression
      - name: Require complete raw results and unchanged original sources
        if: always()
        timeout-minutes: 3
        env:
          LOCAL_ANNOTATION_TOOLCHAIN_OUTCOME: ${{ steps.toolchain.outcome }}
          LOCAL_ANNOTATION_LOCAL_OUTCOME: ${{ steps.local.outcome }}
          LOCAL_ANNOTATION_EXCHANGE_OUTCOME: ${{ steps.exchange.outcome }}
        run: python3 Scripts/CI/local-annotation-editor-apple.py --phase after
      - name: Preserve original source, logs, and owned fixture evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: local-annotation-apple43-cold2-exchange28-crash2
          path: |
            build/local-annotation-editor-route/**
            build/local-annotation-editor-acceptance/*.json
            build/local-annotation-editor-acceptance/*.log
            build/local-annotation-editor-acceptance/owned-*/fixtures/**
            build/local-annotation-editor-acceptance/owned-*/package/Package.swift
            build/local-annotation-editor-acceptance/owned-*/package/Sources/**
            build/local-annotation-editor-exchange-regression/*.json
            build/local-annotation-editor-exchange-regression/*.log
            build/local-annotation-editor-exchange-regression/owned-*/fixtures/**
            build/local-annotation-editor-exchange-regression/owned-*/package/Package.swift
            build/local-annotation-editor-exchange-regression/owned-*/package/Sources/**
          if-no-files-found: error
          retention-days: 30
