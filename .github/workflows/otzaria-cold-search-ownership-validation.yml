name: Exact cold-search Darwin ownership checks

on:
  push:
    branches:
      - codex/otzaria-cold-search-ownership-apple-20261120

permissions:
  actions: read
  contents: read

concurrency:
  group: cold-search-ownership-${{ github.ref }}
  cancel-in-progress: false

jobs:
  darwin-ownership:
    if: ${{ github.event_name == 'push' && github.repository == 'davidpovarsky/Maktabah' && github.ref == 'refs/heads/codex/otzaria-cold-search-ownership-apple-20261120' }}
    runs-on: xcode-27
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
          submodules: false
          persist-credentials: false
      - name: Verify exact checkout and reviewed driver inputs
        run: |
          python3 - <<'PY'
          import hashlib, json, os, pathlib, re, subprocess
          root = pathlib.Path.cwd()
          head = subprocess.check_output(["git", "rev-parse", "HEAD"], text=True).strip()
          assert re.fullmatch(r"[0-9a-f]{40}", os.environ["GITHUB_SHA"]) and head == os.environ["GITHUB_SHA"]
          assert os.environ["GITHUB_REPOSITORY"] == "davidpovarsky/Maktabah"
          assert os.environ["GITHUB_REF"] == "refs/heads/codex/otzaria-cold-search-ownership-apple-20261120"
          assert not subprocess.check_output(["git", "status", "--porcelain", "--untracked-files=no"], text=True)
          pins = {
              "Tests/HQ/cold-search-ownership/OWNERSHIP_INPUTS.json": "85d72a500037ff914fe47b2cc33094a104df8d13cbddcfac9294236dbe0bbdb2",
              "tools/hq-cold-search-ownership.py": "06226561f58167cbf0dbf3ec070e1255037eaceda9c7b7640010548745d398aa",
              "Scripts/CI/select-runtime27-toolchain.py": "92b748b10a32e8d40ff97190bb3b0ba4c199c5e688d8897084406b1bbad43dd8",
          }
          for path, expected in pins.items():
              assert hashlib.sha256((root / path).read_bytes()).hexdigest() == expected, path
          output = root / "build/cold-search-ownership-route"
          output.mkdir(parents=True, exist_ok=False)
          (output / "source-route.json").write_text(json.dumps({"head": head, "github": {key: os.environ.get(key) for key in ("GITHUB_REPOSITORY", "GITHUB_REF", "GITHUB_RUN_ID", "GITHUB_RUN_ATTEMPT")}, "pinned_inputs": pins, "scope": "Darwin Foundation with explicit native constructor double; zero real engine or Native UI credit"}, indent=2) + "\n")
          PY
      - name: Select the unchanged reviewed Apple toolchain
        run: python3 Scripts/CI/select-runtime27-toolchain.py --github-env --report build/cold-search-ownership-route/toolchain.json
      - name: Verify strict evidence classification
        run: |
          set -o pipefail
          python3 Tests/HQ/cold-search-ownership/test_ownership_driver.py 2>&1 | tee build/cold-search-ownership-route/verifier.log
      - name: Execute exact pre-guard and candidate ownership cases
        run: >-
          python3 tools/hq-cold-search-ownership.py
          --repo .
          --output build/cold-search-ownership
          --expected-inputs-sha256 85d72a500037ff914fe47b2cc33094a104df8d13cbddcfac9294236dbe0bbdb2
      - name: Preserve actual source, compiler, and ownership evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cold-search-darwin-ownership
          path: |
            build/cold-search-ownership-route/**
            build/cold-search-ownership/**
          if-no-files-found: error
