name: Upstream merge diagnostic 2026-09-04

on:
  push:
    branches:
      - codex/upstream-main-sync-2026-09-04-mergework

permissions:
  contents: write

jobs:
  merge-diagnostic:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Check out clean target branch
        uses: actions/checkout@v4
        with:
          ref: codex/upstream-main-sync-2026-09-04
          fetch-depth: 0

      - name: Merge complete upstream main and persist diagnostic report
        shell: bash
        run: |
          set -u
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git remote remove upstream 2>/dev/null || true
          git remote add upstream https://github.com/bismillah-100/Maktabah.git
          git fetch upstream main

          set +e
          git merge --no-ff --no-commit upstream/main
          merge_status=$?
          set -e

          report=/tmp/upstream-merge-conflicts-2026-09-04.txt
          : > "$report"
          {
            echo "MERGE_STATUS=$merge_status"
            echo "TARGET_HEAD=$(git rev-parse HEAD)"
            echo "UPSTREAM_HEAD=$(git rev-parse upstream/main)"
            echo
            echo "=== UNMERGED PATHS ==="
            git diff --name-only --diff-filter=U
            echo
            echo "=== STATUS ==="
            git status --short
            echo
            echo "=== INDEX STAGES ==="
            git ls-files -u || true
          } >> "$report"

          git diff --name-only --diff-filter=U > /tmp/conflicts.txt
          while IFS= read -r path; do
            [ -n "$path" ] || continue
            {
              echo
              echo "================================================================================"
              echo "CONFLICT: $path"
              echo "================================================================================"
              echo "--- WORKTREE DIFF / CONFLICT MARKERS ---"
              git diff -- "$path" || true
              for stage in 1 2 3; do
                case "$stage" in
                  1) label=BASE ;;
                  2) label=OURS ;;
                  3) label=THEIRS_UPSTREAM ;;
                esac
                echo
                echo "--- $label (stage $stage) ---"
                if git cat-file -e ":$stage:$path" 2>/dev/null; then
                  git show ":$stage:$path" || true
                else
                  echo "<absent>"
                fi
              done
            } >> "$report"
          done < /tmp/conflicts.txt

          git merge --abort || true
          git checkout -B codex/upstream-main-sync-2026-09-04-mergework origin/codex/upstream-main-sync-2026-09-04-mergework
          cp "$report" upstream-merge-conflicts-2026-09-04.txt
          git add upstream-merge-conflicts-2026-09-04.txt
          git commit -m "Record upstream merge conflict report 2026-09-04"
          git push origin HEAD:codex/upstream-main-sync-2026-09-04-mergework
