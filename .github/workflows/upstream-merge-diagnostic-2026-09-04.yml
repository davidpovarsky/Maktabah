name: Upstream merge diagnostic 2026-09-04

on:
  push:
    branches:
      - codex/upstream-main-sync-2026-09-04-mergework

permissions:
  contents: write

jobs:
  merge-diagnostic:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Check out clean target branch
        uses: actions/checkout@v4
        with:
          ref: codex/upstream-main-sync-2026-09-04
          fetch-depth: 0

      - name: Capture exact merge conflicts and index stages
        shell: bash
        run: |
          set -u
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git remote remove upstream 2>/dev/null || true
          git remote add upstream https://github.com/bismillah-100/Maktabah.git
          git fetch upstream main

          diag=/tmp/merge-diagnostics
          rm -rf "$diag"
          mkdir -p "$diag"/{base,ours,theirs,worktree}

          set +e
          git merge --no-ff --no-commit upstream/main > "$diag/merge.log" 2>&1
          merge_status=$?
          set -e

          git diff --name-only --diff-filter=U > "$diag/conflicts.txt"
          {
            echo "MERGE_STATUS=$merge_status"
            echo "TARGET_HEAD=$(git rev-parse HEAD)"
            echo "UPSTREAM_HEAD=$(git rev-parse upstream/main)"
            echo "CONFLICT_COUNT=$(wc -l < "$diag/conflicts.txt" | tr -d ' ')"
          } > "$diag/summary.txt"

          while IFS= read -r path; do
            [ -n "$path" ] || continue
            mkdir -p "$diag/base/$(dirname "$path")" "$diag/ours/$(dirname "$path")" "$diag/theirs/$(dirname "$path")" "$diag/worktree/$(dirname "$path")"
            if git cat-file -e ":1:$path" 2>/dev/null; then git show ":1:$path" > "$diag/base/$path"; else printf '<absent>\n' > "$diag/base/$path"; fi
            if git cat-file -e ":2:$path" 2>/dev/null; then git show ":2:$path" > "$diag/ours/$path"; else printf '<absent>\n' > "$diag/ours/$path"; fi
            if git cat-file -e ":3:$path" 2>/dev/null; then git show ":3:$path" > "$diag/theirs/$path"; else printf '<absent>\n' > "$diag/theirs/$path"; fi
            git diff -- "$path" > "$diag/worktree/$path.diff" || true
          done < "$diag/conflicts.txt"

          git merge --abort || true
          git checkout -B codex/upstream-main-sync-2026-09-04-mergework origin/codex/upstream-main-sync-2026-09-04-mergework
          rm -rf merge-diagnostics upstream-merge-conflicts-2026-09-04.txt
          cp -R "$diag" merge-diagnostics
          git add -A merge-diagnostics upstream-merge-conflicts-2026-09-04.txt
          git commit -m "Capture inspectable upstream merge conflicts 2026-09-04"
          git push origin HEAD:codex/upstream-main-sync-2026-09-04-mergework
